      "Revised":     "bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-300"
    };

    const LS_KEYS = {
      theme:       "medrev:theme",
      qStatus:     "medrev:qStatus",     // { [questionId]: "To-Do" | "In Progress" | "Revised" }
      quests:      "medrev:quests",      // { [questId]: true }
      dailyQuest:  "medrev:dailyQuest",  // { date: "YYYY-MM-DD", target: N, questionIds: [...] }
      lastView:    "medrev:lastView"
    };

    /* =====================================================================
       STATE HELPERS — read/write localStorage safely
       ===================================================================== */
    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        console.warn("Failed to parse", key, e);
        return fallback;
      }
    }
    function saveJSON(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); }
      catch (e) { console.warn("Failed to write", key, e); }
    }
    function getQuestionStatus(qid) {
      const map = loadJSON(LS_KEYS.qStatus, {});
      return map[qid] || STATUS.TODO;
    }
    function setQuestionStatus(qid, status) {
      const map = loadJSON(LS_KEYS.qStatus, {});
      map[qid] = status;
      saveJSON(LS_KEYS.qStatus, map);
    }
    function getQuestDone(questId) {
      const map = loadJSON(LS_KEYS.quests, {});
      return !!map[questId];
    }
    function setQuestDone(questId, done) {
      const map = loadJSON(LS_KEYS.quests, {});
      map[questId] = done;
      saveJSON(LS_KEYS.quests, map);
    }

    /* =====================================================================
       DAILY QUEST SYSTEM
       ---------------------------------------------------------------------
       The Daily Quest auto-assigns a slice of unrevised questions to the
       student every day, sized so that finishing the daily target every
       day would land them exam-ready on the morning of Sept 7th 2026.

       Design choices worth knowing:
       • The quest is anchored to the *local* calendar date — so it resets
         at midnight wherever the student is, not at UTC midnight. This
         matters because an Indian student would otherwise see their quest
         reshuffle at 5:30 AM IST, which feels broken.
       • We pick the FIRST N unrevised questions (sequential, not random).
         Sequential order groups nearby topics together (better for recall),
         mirrors the natural Pathology→Micro→Pharma study order, and avoids
         the “lucky dip” trap where a hard question keeps reappearing.
       • Completion is derived from the existing qStatus map — we don’t
         store a separate completedIds array. Single source of truth = no
         sync bugs. If the student marks a question Revised from anywhere
         else (sidebar, all-questions list), the daily quest reflects it.
       ===================================================================== */

    /**
     * Returns today’s date as “YYYY-MM-DD” using the *local* clock.
     * We deliberately avoid toISOString() because that converts to UTC
     * and would shift the day boundary for non-UTC timezones.
     */
    function getTodayDateString() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm   = String(d.getMonth() + 1).padStart(2, '0');
      const dd   = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    /**
     * The math behind the daily target:
     *   remaining_questions ÷ remaining_days → round UP.
     *
     * Why round up (Math.ceil) instead of round-to-nearest?
     *   If 200 questions / 10 days = 20 exactly, no problem.
     *   But 201 / 10 = 20.1 → 21 with ceil. The extra 1 question per day
     *   buys a small buffer that compounds: by day 9 the student has
     *   already finished 189 of 201 (94%), and the last day is light.
     *   Rounding *down* would push unfinished work onto the day before
     *   the exam — exactly when the student should be resting, not cramming.
     *
     * Edge case: if we’re inside an exam day or past the first exam,
     * remainingDays floors at 1 so we don’t divide by zero.
     */
    function calculateDailyTarget() {
      const statusMap = loadJSON(LS_KEYS.qStatus, {});
      const remaining = flatQuestions.filter(
        q => (statusMap[q.id] || STATUS.TODO) !== STATUS.REVISED
      ).length;

      // First exam in the schedule is our hard deadline.
      const firstExam = new Date(EXAM_SCHEDULE[0].date);
      const now = new Date();
      const msPerDay = 24 * 60 * 60 * 1000;
      const remainingDays = Math.max(1, Math.ceil((firstExam - now) / msPerDay));

      const dailyTarget = remaining > 0 ? Math.ceil(remaining / remainingDays) : 0;
      return { remaining, remainingDays, dailyTarget };
    }

    /**
     * Build a fresh daily quest: pick the first N unrevised questions,
     * stamp them with today’s date, persist to localStorage.
     */
    function assignDailyQuest() {
      const today = getTodayDateString();
      const { dailyTarget } = calculateDailyTarget();
      const statusMap = loadJSON(LS_KEYS.qStatus, {});

      // flatQuestions is already in subject → paper → section → question
      // order, so slicing the first N unrevised gives us a contiguous,
      // logically-grouped batch.
      const unrevised = flatQuestions.filter(
        q => (statusMap[q.id] || STATUS.TODO) !== STATUS.REVISED
      );
      const questionIds = unrevised.slice(0, dailyTarget).map(q => q.id);

      const quest = {
        date: today,
        target: dailyTarget,
        questionIds: questionIds
      };
      saveJSON(LS_KEYS.dailyQuest, quest);
      return quest;
    }

    /**
     * Returns today’s quest, assigning a new one if:
     *   • no quest exists yet, OR
     *   • the stored quest is from a previous day (date mismatch)
     * The “date mismatch” check is what makes the quest reset at midnight
     * without needing a timer or cron job — it’s evaluated lazily on read.
     */
    function getDailyQuest() {
      const today = getTodayDateString();
      const stored = loadJSON(LS_KEYS.dailyQuest, null);
      if (stored && stored.date === today) return stored;
      return assignDailyQuest();
    }

    /**
     * Derives completion stats for today’s quest from the qStatus map.
     * Returning isComplete separately saves the caller from re-checking.
     */
    function getQuestProgress() {
      const quest = getDailyQuest();
      if (!quest.questionIds.length) {
        return { completed: 0, total: 0, pct: 100, isComplete: true };
      }
      const statusMap = loadJSON(LS_KEYS.qStatus, {});
      const completed = quest.questionIds.filter(
        qid => statusMap[qid] === STATUS.REVISED
      ).length;
      const total = quest.questionIds.length;
      const pct = total ? Math.round((completed / total) * 100) : 100;
      return { completed, total, pct, isComplete: completed >= total };
    }

    /* =====================================================================
       FLATTENED QUESTION INDEX
       We flatten the nested data into a single array with back-references
       so search & stats are O(N) and trivially correct.
       ===================================================================== */
    const flatQuestions = [];
    medicalQuestionsData.forEach((subj, si) => {
      subj.papers.forEach((paper, pi) => {
        paper.sections.forEach((sec, sci) => {
          sec.questions.forEach((q, qi) => {
            flatQuestions.push({
              ...q,
              subjectIdx: si,
              paperIdx: pi,
              sectionIdx: sci,
              qIdx: qi
            });
          });
        });
      });
    });
    const TOTAL_QUESTIONS = flatQuestions.length;

    /* =====================================================================
       EXAM COUNTDOWN
       Picks the next upcoming exam from EXAM_SCHEDULE and ticks every
       second. If we are inside an exam window (start..start+3h), show
       "Exam in Progress" instead of a countdown.
       ===================================================================== */
    function pickNextExam(now) {
      const nowMs = now.getTime();
      for (const ex of EXAM_SCHEDULE) {
        const start = new Date(ex.date).getTime();
        const end   = start + 3 * 60 * 60 * 1000; // 9:30 → 12:30 exam window
        if (nowMs < start) return { ...ex, start, end, state: "upcoming" };
        if (nowMs >= start && nowMs < end) return { ...ex, start, end, state: "in-progress" };
      }
      // All exams done
      return null;
    }
    function renderExamCountdown() {
      const now = new Date();
      const next = pickNextExam(now);
      const targetEls = [document.getElementById('examCountdown'),
                         document.getElementById('examCountdownMobile')];

      if (!next) {
        targetEls.forEach(el => el && (el.innerHTML =
          `<span class="px-3 py-1.5 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-semibold">All exams completed ✓</span>`));
        return;
      }

      if (next.state === "in-progress") {
        const html = `<span class="px-3 py-1.5 rounded-lg bg-emerald-500 text-white text-xs font-semibold flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
          ${next.subject} ${next.paper} — Exam in Progress
        </span>`;
        targetEls.forEach(el => el && (el.innerHTML = html));
        return;
      }

      const diff = next.start - now.getTime();
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);

      const cell = (val, label) =>
        `<div class="text-center px-1.5">
           <div class="font-mono font-bold text-sm leading-none">${String(val).padStart(2,'0')}</div>
           <div class="text-[9px] uppercase tracking-wide opacity-80">${label}</div>
         </div>`;
      const html = `
        <div class="flex items-center gap-2">
          <div class="text-[10px] leading-tight uppercase tracking-wide opacity-90">
            Next Exam<br><span class="font-bold">${next.subject} ${next.paper}</span><br>
            <span class="opacity-80 normal-case font-normal">${new Date(next.start).toLocaleDateString('en-IN', {day:'numeric',month:'short'})} • 9:30 AM</span>
          </div>
          <div class="flex items-center gap-1">
            ${cell(d,'d')}${cell(h,'h')}${cell(m,'m')}${cell(s,'s')}
          </div>
        </div>`;
      targetEls.forEach(el => el && (el.innerHTML = html));
    }

                    ? `Exam in progress right now: <strong>${next.subject} ${next.paper}</strong>`
                    : `Next exam: <strong>${next.subject} ${next.paper}</strong> on <strong>${new Date(next.start).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</strong> at 9:30 AM`}
                </p>
                <button data-view="all-questions"
                        class="nav-top mt-3 inline-flex items-center gap-1.5 text-xs font-semibold bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-lg transition-colors">
                  Revise ${next.subject} questions →
                </button>
              </div>
            </div>
          </div>` : ''}

          <!-- Syllabus quest summary -->
          <div class="rounded-xl p-5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
            <div class="flex items-center justify-between mb-2">
              <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-200">Syllabus Quest Progress</h3>
              <span class="text-xs font-mono text-slate-500 dark:text-slate-400">${qDone} / ${qTotal}  •  ${qPct}%</span>
            </div>
            <div class="h-3 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
              <div class="h-full bg-gradient-to-r from-accent-500 to-brand-500 transition-all duration-700" style="width:${qPct}%"></div>
            </div>
            <button data-view="quests" class="nav-top mt-3 text-xs font-semibold text-brand-600 dark:text-brand-400 hover:underline">Open Syllabus Quests →</button>
          </div>

        </div>
      `;
      // Re-bind nav-top buttons (rendered inside HTML strings)
      bindNavTop();
      // Wire up the Daily Quest “Mark Revised” buttons.
      bindDailyQuestCard();
    }

    /* =====================================================================
       DAILY QUEST UI — renders the prominent indigo/purple card at the
       very top of the Stats Dashboard. Kept visually distinct from the
       blue stat tiles below so the student instantly recognises it as
       “today’s action item” rather than “another statistic”.
       ===================================================================== */
    function renderDailyQuestCard() {
      const { remaining, remainingDays, dailyTarget } = calculateDailyTarget();
      const quest = getDailyQuest();
      const { completed, total, pct, isComplete } = getQuestProgress();
      const statusMap = loadJSON(LS_KEYS.qStatus, {});

      // ── All-caught-up state: no questions left to revise ──────────────
      if (dailyTarget === 0 || remaining === 0) {
        return `
          <div class="rounded-2xl p-6 bg-gradient-to-br from-emerald-500 via-emerald-600 to-teal-700 text-white shadow-xl relative overflow-hidden">
            <div class="absolute -right-8 -top-8 w-40 h-40 rounded-full bg-white/10 blur-xl"></div>
            <div class="relative flex items-center gap-4">
              <div class="text-4xl">🏆</div>
              <div>
                <h2 class="text-xl font-extrabold">All caught up!</h2>
                <p class="opacity-90 text-sm mt-1">Every question is revised — you’re exam-ready. Take a breath, you earned it. 🎉</p>
              </div>
            </div>
          </div>`;
      }

      // ── Build the per-question rows ───────────────────────────────────
      const questQuestions = quest.questionIds
        .map(qid => flatQuestions.find(q => q.id === qid))
        .filter(Boolean);

      const listHtml = questQuestions.map(q => {
        const st = statusMap[q.id] || STATUS.TODO;
        const isRevised = st === STATUS.REVISED;
        const marksColor = q.marks >= 15
          ? 'bg-rose-400/30 text-rose-100'
          : q.marks >= 6
            ? 'bg-amber-400/30 text-amber-100'
            : q.marks >= 4
              ? 'bg-sky-400/30 text-sky-100'
              : 'bg-slate-300/30 text-slate-100';
        return `
          <div class="flex items-start gap-3 p-2.5 rounded-lg ${isRevised ? 'bg-white/10 opacity-60' : 'bg-white/15 hover:bg-white/25'} transition-colors">
            <div class="shrink-0 w-7 h-7 rounded flex items-center justify-center text-[10px] font-bold ${marksColor}">${q.marks}m</div>
            <div class="flex-1 min-w-0">
              <div class="text-[10px] uppercase tracking-wide opacity-70 font-mono">${q.subject} • ${q.paper}</div>
              <div class="text-sm leading-snug ${isRevised ? 'line-through' : ''}">${escapeHtml(q.question)}</div>
            </div>
            ${isRevised
              ? `<span class="shrink-0 text-xs font-semibold px-2 py-1 rounded bg-emerald-400/30 text-emerald-100">✓ Done</span>`
              : `<button class="quest-mark-btn shrink-0 text-xs font-semibold px-2.5 py-1 rounded bg-white text-indigo-700 hover:bg-indigo-50 transition-colors shadow-sm" data-qid="${q.id}">Mark Revised</button>`
            }
          </div>`;
      }).join('');

      // ── Main card ─────────────────────────────────────────────────────
      // Indigo→purple→fuchsia gradient deliberately diverges from the
      // brand-blue used elsewhere so this card “pops” as the day’s focus.
      return `
        <div class="rounded-2xl p-5 sm:p-6 bg-gradient-to-br from-indigo-600 via-purple-600 to-fuchsia-600 text-white shadow-xl border border-indigo-400/30 relative overflow-hidden">
          <div class="absolute -right-10 -top-10 w-48 h-48 rounded-full bg-white/10 blur-2xl"></div>
          <div class="absolute -left-10 -bottom-10 w-40 h-40 rounded-full bg-fuchsia-400/20 blur-2xl"></div>

          <div class="relative">
            <!-- Header row -->
            <div class="flex items-start justify-between gap-3 flex-wrap">
              <div class="flex items-center gap-3">
                <div class="text-3xl">🎯</div>
                <div>
                  <h2 class="text-lg sm:text-xl font-extrabold tracking-tight">Today’s Daily Quest</h2>
                  <p class="text-xs opacity-90 mt-0.5">
                    ${isComplete
                      ? `Quest complete — see you tomorrow! 🌙`
                      : `Daily Goal: Complete <strong>${total}</strong> question${total !== 1 ? 's' : ''} today`}
                  </p>
                </div>
              </div>
              <div class="text-right text-[11px] opacity-90 leading-tight">
                <div class="font-mono text-base font-bold">${remaining}</div>
                <div class="uppercase tracking-wide opacity-80">questions left</div>
                <div class="font-mono mt-1">${remainingDays}d</div>
                <div class="uppercase tracking-wide opacity-80">until exam</div>
              </div>
            </div>

            ${isComplete
              ? `<div class="mt-5 p-5 rounded-xl bg-white/15 backdrop-blur-sm text-center">
                  <div class="text-3xl mb-2">🎉</div>
                  <p class="font-bold text-lg">Quest Complete! Great job.</p>
                  <p class="text-sm opacity-90 mt-1.5 max-w-md mx-auto">Check back tomorrow for your next batch. Rest well — consistency beats cramming every single time.</p>
                </div>`
              : `
                <!-- Progress bar -->
                <div class="mt-5">
                  <div class="flex items-center justify-between text-xs mb-1.5">
                    <span class="font-semibold">Today’s Progress</span>
                    <span class="font-mono opacity-90">${completed} / ${total}  •  ${pct}%</span>
                  </div>
                  <div class="h-2.5 rounded-full bg-white/20 overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-emerald-300 to-emerald-400 transition-all duration-500" style="width:${pct}%"></div>
                  </div>
                </div>

                <!-- Math explainer — shows the student exactly how the target was derived,
                     so they understand why today’s number is what it is. -->
                <p class="text-[11px] opacity-75 mt-2 italic">
                  📐 ${remaining} unrevised ÷ ${remainingDays} days until exam = ${dailyTarget} questions/day (rounded up)
                </p>

                <!-- Quest question list -->
                <div class="mt-4 space-y-1.5 max-h-80 overflow-y-auto scrollbar-thin pr-1">
                  ${listHtml}
                </div>
              `
            }
          </div>
        </div>`;
    }

    /**
     * Wires up the “Mark Revised” buttons inside the Daily Quest card.
     * We use explicit per-button binding rather than event delegation:
     * with at most ~25 buttons per day the perf difference is invisible,
     * and the code stays trivially debuggable.
     */
    function bindDailyQuestCard() {
      document.querySelectorAll('.quest-mark-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const qid = btn.dataset.qid;
          setQuestionStatus(qid, STATUS.REVISED);
          // Re-render the entire stats view in one go. This is the simplest
          // way to guarantee every dependent UI element — overall progress,
          // subject-wise bars, the daily quest card itself — all stay in
          // perfect sync with the new qStatus state. No stale UI possible.
          renderStatsView();
          // Also refresh the sidebar dot indicators so the green “revised”
          // dot appears next to the question in the tree.
          refreshSidebarTreeStatusIndicators();
        });
      });
    }

    /* =====================================================================
       SYLLABUS QUESTS VIEW
       ===================================================================== */
    function renderQuestsView() {
      const main = document.getElementById('mainContent');

      let qTotal = 0, qDone = 0;
      syllabusQuestData.forEach(subj => subj.papers.forEach(p => p.topics.forEach((t, ti) => {
        qTotal++;
        if (getQuestDone(`quest_${subj.subject}_${p.paper}_${ti}`)) qDone++;
      })));
      const qPct = qTotal ? Math.round((qDone / qTotal) * 100) : 0;

      const subjColor = {
        "Pathology":     "rose",
        "Microbiology":  "emerald",
        "Pharmacology":  "brand"
      };

      main.innerHTML = `
        <div class="space-y-5">
          <div>
            <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100">Syllabus Quest Tracker</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
              Parsed from the university SY MBBS CBME curriculum circular.
              Tick off each topic as you complete it — progress saves to your browser.
            </p>
          </div>

          <div class="rounded-xl p-5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
            <div class="flex items-center justify-between mb-2">
              <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-200">Overall Syllabus Coverage</h3>
              <span class="text-xs font-mono text-slate-500 dark:text-slate-400">${qDone} / ${qTotal}  •  ${qPct}%</span>
            </div>
            <div class="h-3 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
              <div class="h-full bg-gradient-to-r from-accent-500 to-brand-500 transition-all duration-700" style="width:${qPct}%"></div>
            </div>
          </div>

          ${syllabusQuestData.map(subj => {
            const color = subjColor[subj.subject] || 'slate';
            let subjTotal = 0, subjDone = 0;
            subj.papers.forEach(p => p.topics.forEach((t, ti) => {
              subjTotal++;
              if (getQuestDone(`quest_${subj.subject}_${p.paper}_${ti}`)) subjDone++;
            }));
            const subjPct = subjTotal ? Math.round((subjDone/subjTotal)*100) : 0;

            return `
              <div class="rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden shadow-sm bg-white dark:bg-slate-900">
                <div class="px-4 py-3 bg-gradient-to-r ${color === 'brand' ? 'from-brand-500 to-indigo-600' : color === 'rose' ? 'from-rose-500 to-pink-600' : 'from-emerald-500 to-teal-600'} text-white">
                  <div class="flex items-center justify-between">
                    <h3 class="font-bold text-sm">${subj.subject}</h3>
                    <span class="text-xs font-mono opacity-90">${subjDone}/${subjTotal} • ${subjPct}%</span>
                  </div>
                  <div class="h-1.5 rounded-full bg-white/20 mt-2 overflow-hidden">
                    <div class="h-full bg-white transition-all duration-700" style="width:${subjPct}%"></div>
                  </div>
                </div>
                ${subj.papers.map(p => {
                  let pTotal = 0, pDone = 0;
                  p.topics.forEach((t, ti) => {
                    pTotal++;
                    if (getQuestDone(`quest_${subj.subject}_${p.paper}_${ti}`)) pDone++;
                  });
                  return `
                    <div class="border-t border-slate-200 dark:border-slate-800">
                      <div class="px-4 py-2 bg-slate-50 dark:bg-slate-800/50 flex items-center justify-between">
                        <span class="text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wide">${p.paper}</span>
                        <span class="text-[10px] font-mono text-slate-400">${pDone}/${pTotal}</span>
                      </div>
                      <ul class="divide-y divide-slate-100 dark:divide-slate-800">
                        ${p.topics.map((t, ti) => {
                          const id = `quest_${subj.subject}_${p.paper}_${ti}`;
                          const done = getQuestDone(id);
                          return `
                            <li class="flex items-start gap-3 px-4 py-2.5 hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors">
                              <label class="flex items-start gap-3 cursor-pointer flex-1">
                                <input type="checkbox" data-quest-id="${id}" ${done ? 'checked' : ''}
                                       class="mt-0.5 w-4 h-4 rounded text-brand-600 focus:ring-brand-500 border-slate-300 dark:border-slate-600 dark:bg-slate-800">
                                <span class="text-sm ${done ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-700 dark:text-slate-200'}">${t}</span>
                              </label>
                            </li>`;
                        }).join('')}
                      </ul>
                    </div>`;
                }).join('')}
              </div>
            `;
          }).join('')}
        </div>
      `;

      // Wire up the checkboxes
      main.querySelectorAll('input[data-quest-id]').forEach(cb => {
        cb.addEventListener('change', e => {
          const id = e.target.dataset.questId;
          setQuestDone(id, e.target.checked);
          // Re-render to update progress bars (cheap and correct)
          renderQuestsView();
        });
      });
    }

    /* =====================================================================
       ALL QUESTIONS VIEW (filterable list)
       ===================================================================== */
    let currentSearchQuery = "";
    function renderAllQuestionsView(filterFn) {
      const main = document.getElementById('mainContent');

      let list = flatQuestions;
      if (filterFn) list = flatQuestions.filter(filterFn);
      else if (currentSearchQuery) {
        const q = currentSearchQuery.toLowerCase();
        list = flatQuestions.filter(item =>
          item.question.toLowerCase().includes(q) ||
          item.subject.toLowerCase().includes(q) ||
          item.paper.toLowerCase().includes(q) ||
          item.section.toLowerCase().includes(q) ||
          item.answer.toLowerCase().includes(q)
        );
      }

      const statusMap = loadJSON(LS_KEYS.qStatus, {});

      main.innerHTML = `
        <div class="space-y-4">
          <div class="flex items-center justify-between flex-wrap gap-2">
            <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100">
              ${filterFn ? 'Filtered Questions' : 'All Questions'}
              <span class="text-sm font-normal text-slate-500 dark:text-slate-400">(${list.length})</span>
            </h2>
            ${filterFn ? `<button data-view="all-questions" class="nav-top text-xs text-brand-600 dark:text-brand-400 hover:underline">← back to all</button>` : ''}
          </div>
          <div class="space-y-2">
            ${list.length === 0
              ? `<div class="text-center py-16 text-slate-400 dark:text-slate-500">
                  <div class="text-4xl mb-2">🔍</div>
                  <p class="text-sm">No questions match your search.</p>
                </div>`
              : list.map(q => {
                const st = statusMap[q.id] || STATUS.TODO;
                return `
                <button data-qid="${q.id}"
                        class="q-card w-full text-left rounded-lg p-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-brand-400 dark:hover:border-brand-500 hover:shadow-sm transition-all">
                  <div class="flex items-start gap-3">
                    <div class="shrink-0 w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold
                                ${q.marks >= 15 ? 'bg-rose-100 text-rose-700 dark:bg-rose-900/30 dark:text-rose-300'
                                  : q.marks >= 6 ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-300'
                                  : q.marks >= 4 ? 'bg-brand-100 text-brand-700 dark:bg-brand-900/30 dark:text-brand-300'
                                  : 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300'}">
                      ${q.marks || '?'}m
                    </div>
                    <div class="flex-1 min-w-0">
                      <div class="flex items-center gap-2 flex-wrap mb-1">
                        <span class="text-[10px] font-mono uppercase tracking-wide text-slate-500 dark:text-slate-400">${q.subject} • ${q.paper}</span>
                        <span class="text-[10px] text-slate-400 dark:text-slate-500">${q.section}</span>
                        <span class="text-[10px] px-1.5 py-0.5 rounded-full font-medium ${STATUS_COLORS[st]}">${st}</span>
                      </div>
                      <div class="text-sm text-slate-700 dark:text-slate-200 line-clamp-2">${escapeHtml(q.question)}</div>
                    </div>
                    <svg class="w-4 h-4 text-slate-400 shrink-0 mt-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                  </div>
                </button>`;
              }).join('')}
          </div>
        </div>
      `;

      // Bind card clicks
      main.querySelectorAll('.q-card').forEach(card => {
        card.addEventListener('click', () => {
          const qid = card.dataset.qid;
          const q = flatQuestions.find(x => x.id === qid);
          if (q) renderQuestionDetail(q);
        });
      });
      bindNavTop();
    }

    /* =====================================================================
       QUESTION DETAIL VIEW (with Print / Save-as-PDF)
       ===================================================================== */
    function renderQuestionDetail(q) {
      const main = document.getElementById('mainContent');
      const status = getQuestionStatus(q.id);
      const isPending = q.answer === "Answer pending generation. Click here to generate.";

      main.innerHTML = `
        <div class="space-y-4 max-w-3xl mx-auto">

          <!-- Back -->
          <button id="backBtn" class="no-print text-xs text-slate-500 dark:text-slate-400 hover:text-brand-600 dark:hover:text-brand-400 flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Back
          </button>

          <!-- Question card -->
          <div class="answer-card rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">

            <!-- Question header -->
            <div class="px-5 py-4 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50">
              <div class="flex items-center gap-2 flex-wrap mb-2 text-[10px] uppercase tracking-wide font-mono text-slate-500 dark:text-slate-400">
                <span>${q.subject}</span><span>›</span>
                <span>${q.paper}</span><span>›</span>
                <span>${q.section}</span>
                <span class="ml-auto px-2 py-0.5 rounded-full bg-brand-100 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300 font-semibold">${q.marks} marks</span>
              </div>
              <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100 leading-snug">${escapeHtml(q.question)}</h2>

              <!-- Status toggle + print -->
              <div class="no-print flex items-center gap-2 mt-3 flex-wrap">
                <span class="text-[11px] text-slate-500 dark:text-slate-400 font-medium">Status:</span>
                <div class="inline-flex rounded-lg border border-slate-200 dark:border-slate-700 overflow-hidden text-[11px]">
                  ${Object.values(STATUS).map(s => `
                    <button data-status="${s}"
                            class="status-btn px-2.5 py-1 font-medium transition-colors
                                   ${status === s
                                     ? (s === STATUS.TODO ? 'bg-slate-600 text-white'
                                        : s === STATUS.IN_PROGRESS ? 'bg-amber-500 text-white'
                                        : 'bg-emerald-600 text-white')
                                     : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                      ${s}
                    </button>
                  `).join('')}
                </div>
                <button id="printBtn" class="ml-auto inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white transition-colors">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>
                  </svg>
                  Print / Save as PDF
                </button>
              </div>
            </div>

            <!-- Answer body -->
            <div class="px-5 py-5">
              ${isPending
                ? `<div class="text-center py-10">
                     <div class="text-5xl mb-3">📝</div>
                     <p class="text-slate-600 dark:text-slate-300 font-medium">Answer pending generation.</p>
                     <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 max-w-md mx-auto">
                       Full answer for this question is not yet authored. See <code class="text-xs">CONTRIBUTING.md</code> for how to add it.
                     </p>
                     <button id="simulateGenBtn" class="mt-4 text-xs font-semibold px-3 py-1.5 rounded-lg bg-brand-100 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300 hover:bg-brand-200 dark:hover:bg-brand-900/60 transition-colors">
                       Click here to generate
                     </button>
                   </div>`
                : `<div class="answer-body text-sm leading-relaxed text-slate-700 dark:text-slate-200">${q.answer}</div>`
              }
            </div>
          </div>
        </div>
      `;

      // Wire up back button
      document.getElementById('backBtn').addEventListener('click', () => {
        const last = loadJSON(LS_KEYS.lastView, { view: 'stats' });
        navigateTo(last.view || 'stats');
      });

      // Wire up status buttons
      main.querySelectorAll('.status-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          setQuestionStatus(q.id, btn.dataset.status);
          renderQuestionDetail(q);  // re-render to reflect new status
          refreshSidebarTreeStatusIndicators();
        });
      });

      // Print button
      document.getElementById('printBtn').addEventListener('click', () => window.print());

      // Simulate generate (placeholder CTA for pending questions)
      const simBtn = document.getElementById('simulateGenBtn');
      if (simBtn) {
        simBtn.addEventListener('click', () => {
          simBtn.textContent = "Generating… (open CONTRIBUTING.md to add this answer)";
          simBtn.disabled = true;
        });
      }

      // If the answer contains Mermaid diagrams, re-run mermaid
      if (!isPending) {
        // mermaid needs unique IDs per render; give each diagram a unique id
        const mermaidDivs = main.querySelectorAll('.mermaid');
        mermaidDivs.forEach((d, i) => {
          d.id = 'mermaid-' + Date.now() + '-' + i;
        });
        // Initialise if not already
        try {
          mermaid.initialize({ startOnLoad: false, theme: document.documentElement.classList.contains('dark') ? 'dark' : 'default', securityLevel: 'loose' });
          mermaid.run({ nodes: mermaidDivs });
        } catch (e) { console.warn('Mermaid render failed:', e); }
      }
    }

    /* =====================================================================
       NAVIGATION
       ===================================================================== */
    function navigateTo(view) {
      saveJSON(LS_KEYS.lastView, { view });
      // Highlight active nav button
      document.querySelectorAll('.nav-top').forEach(b => {
        if (b.dataset.view === view) {
          b.classList.add('bg-brand-100','dark:bg-brand-900/40','text-brand-700','dark:text-brand-300');
        } else {
          b.classList.remove('bg-brand-100','dark:bg-brand-900/40','text-brand-700','dark:text-brand-300');
        }
      });
      if (view === 'stats') renderStatsView();
      else if (view === 'quests') renderQuestsView();
      else if (view === 'all-questions') renderAllQuestionsView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Bind top-level nav buttons wherever they live (sidebar or inside cards)
    function bindNavTop() {
      document.querySelectorAll('.nav-top').forEach(btn => {
        // Avoid duplicate listeners by cloning
        const newBtn = btn.cloneNode(true);
        btn.replaceWith(newBtn);
      });
      document.querySelectorAll('.nav-top').forEach(btn => {
        btn.addEventListener('click', () => navigateTo(btn.dataset.view));
      });
    }

    /* =====================================================================
       SEARCH
       ===================================================================== */
    function handleSearch(e) {
      currentSearchQuery = e.target.value.trim();
      const countEl = document.getElementById('searchResultsCount');
      if (!currentSearchQuery) {
        countEl.classList.add('hidden');
        // If we're on the all-questions view, show all; otherwise stay put
        const last = loadJSON(LS_KEYS.lastView, { view: 'stats' });
        if (last.view === 'all-questions') renderAllQuestionsView();
        return;
      }
      const q = currentSearchQuery.toLowerCase();
      const matches = flatQuestions.filter(item =>
        item.question.toLowerCase().includes(q) ||
        item.subject.toLowerCase().includes(q) ||
        item.paper.toLowerCase().includes(q) ||
        item.section.toLowerCase().includes(q) ||
        item.answer.toLowerCase().includes(q)
      );
      countEl.textContent = `${matches.length} matches`;
      countEl.classList.remove('hidden');
      // Jump to the all-questions view, pre-filtered
      navigateTo('all-questions');
      renderAllQuestionsView();
    }

    /* =====================================================================
       SIDEBAR (mobile)
       ===================================================================== */
    function openSidebar() {
      document.getElementById('sidebar').classList.remove('-translate-x-full');
      document.getElementById('sidebarOverlay').classList.remove('hidden');
    }
    function closeSidebar() {
      if (window.innerWidth < 1024) {
        document.getElementById('sidebar').classList.add('-translate-x-full');
        document.getElementById('sidebarOverlay').classList.add('hidden');
      }
    }

    /* =====================================================================
       REFRESH — re-render the sidebar dot indicators after a status change
       We rebuild the tree because it's cheap (423 leaf nodes) and bullet-proof.
       ===================================================================== */
    function refreshSidebarTreeStatusIndicators() {
      const tree = document.getElementById('sidebarTree');
      tree.innerHTML = '';
      buildSidebarTree();
    }

    /* =====================================================================
       UTILITIES
       ===================================================================== */
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    /* =====================================================================
       INIT
       ===================================================================== */
    function init() {
      // Build sidebar accordion
      buildSidebarTree();

      // Top-level nav buttons (sidebar)
      bindNavTop();

      // Search
      document.getElementById('globalSearch').addEventListener('input', handleSearch);

      // Dark mode toggle
      document.getElementById('darkModeToggle').addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        saveJSON(LS_KEYS.theme, isDark ? 'dark' : 'light');
        // Re-run mermaid with new theme if currently on a question view
        const mermaidDivs = document.querySelectorAll('.mermaid');
        if (mermaidDivs.length) {
          try {
            mermaid.initialize({ startOnLoad: false, theme: isDark ? 'dark' : 'default', securityLevel: 'loose' });
            mermaid.run({ nodes: mermaidDivs });
          } catch(e) {}
        }
      });

      // Mobile sidebar toggle
      document.getElementById('sidebarToggle').addEventListener('click', openSidebar);
      document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

      // Exam countdown — tick every second
      renderExamCountdown();
      setInterval(renderExamCountdown, 1000);

      // Default view — stats dashboard
      const last = loadJSON(LS_KEYS.lastView, { view: 'stats' });
      navigateTo(last.view || 'stats');
    }

    // Boot
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
