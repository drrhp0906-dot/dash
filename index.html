  <title>MedRev Dashboard — Second MBBS Revision Hub</title>

  <!-- =====================================================================
       MedRev Dashboard
       Single-file study hub for Second MBBS (Pathology / Microbiology /
       Pharmacology) — built with HTML + Tailwind CSS (CDN) + Mermaid.js
       (CDN) + Vanilla JS + localStorage.
       ===================================================================== -->

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Dark mode is class-based so we can persist it before paint.
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
              400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8',
              800: '#1e40af', 900: '#1e3a8a'
            },
            accent: {
              500: '#10b981', 600: '#059669', 700: '#047857'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'Menlo', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Prevent dark-mode flash on reload: read saved theme synchronously -->
  <script>
    (function () {
      try {
        const t = localStorage.getItem('medrev:theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Mermaid.js for SmartArt / flowcharts -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* Tiny bit of bespoke CSS that Tailwind alone can't do cleanly */
    .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.4); border-radius: 3px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .answer-body h3 { font-size: 1.125rem; font-weight: 700; margin-top: 1rem; margin-bottom: 0.5rem; color: inherit; }
    .answer-body h4 { font-size: 1rem; font-weight: 600; margin-top: 0.75rem; margin-bottom: 0.25rem; color: inherit; }
    .answer-body p { margin-bottom: 0.6rem; line-height: 1.7; }
    .answer-body ul, .answer-body ol { margin-left: 1.25rem; margin-bottom: 0.6rem; line-height: 1.7; }
    .answer-body ul { list-style: disc; }
    .answer-body ol { list-style: decimal; }
    .answer-body li { margin-bottom: 0.25rem; }
    .answer-body img { border-radius: 0.5rem; margin: 1rem 0; max-width: 100%; height: auto; border: 1px solid rgba(148,163,184,0.3); }
    .answer-body table { margin: 1rem 0; }
    .answer-body .mermaid { margin: 1.25rem 0; background: rgba(255,255,255,0.6); padding: 1rem; border-radius: 0.5rem; border: 1px solid rgba(148,163,184,0.3); }
    .dark .answer-body .mermaid { background: rgba(15,23,42,0.6); }
    .answer-body strong { font-weight: 700; }
    .answer-body em { font-style: italic; }
    @media print {
      .no-print { display: none !important; }
      .answer-card { box-shadow: none !important; border: none !important; }
      body { background: white !important; color: black !important; }
    }
  </style>
</head>

  <script>

    const medicalQuestionsData = [
  {
    subject: "Pathology",
    papers: [
      {
        paper: "Paper-1",
        category: "Theory",
        sections: [
          {
            section: "15 Markers (Long Essays / LAQs)",
            questions: [
              {
                id: "q0_0_0_0",
                subject: "Pathology",
                paper: "Paper-1",
                section: "15 Markers (Long Essays / LAQs)",
                marks: 15,
                question: "Define neoplasia. Write contrasting features of Benign and malignant tumors. Describe various routes of spread of tumor and their mechanism.",
                answer: "\n<h3>Definition</h3>\n<p><strong>Neoplasia</strong> (\"new growth\") is an abnormal mass of tissue, the growth of which exceeds and is <strong>uncoordinated</strong> with that of the normal tissues, and persists in the same excessive manner after cessation of the stimuli that evoked the change \u2014 <em>Willis' definition</em>, still the gold standard for viva recall.</p>\n\n<h3>Contrasting Features \u2014 Benign vs Malignant</h3>\n<table class=\"w-full text-sm border-collapse my-3\">\n  <thead class=\"bg-slate-100 dark:bg-slate-700\">\n    <tr><th class=\"border p-2 text-left\">Feature</th><th class=\"border p-2 text-left\">Benign</th><th class=\"border p-2 text-left\">Malignant</th></tr>\n  </thead>\n  <tbody>\n    <tr><td class=\"border p-2\">Differentiation</td><td class=\"border p-2\">Well differentiated; resembles parent tissue</td><td class=\"border p-2\">Poorly differentiated; anaplastic</td></tr>\n    <tr><td class=\"border p-2\">Growth rate</td><td class=\"border p-2\">Slow, mitoses rare & normal</td><td class=\"border p-2\">Rapid, mitoses frequent & atypical</td></tr>\n    <tr><td class=\"border p-2\">Local invasion</td><td class=\"border p-2\"><strong>Capsulated</strong>, pushes tissues aside</td><td class=\"border p-2\"><strong>Infiltrative</strong>, destroys adjacent structures</td></tr>\n    <tr><td class=\"border p-2\">Metastasis</td><td class=\"border p-2\">Absent</td><td class=\"border p-2\">Present (the hallmark of malignancy)</td></tr>\n    <tr><td class=\"border p-2\">Nuclear features</td><td class=\"border p-2\">Bland, uniform chromatin</td><td class=\"border p-2\">Hyperchromatic, pleomorphic, prominent nucleoli</td></tr>\n    <tr><td class=\"border p-2\">Clinical course</td><td class=\"border p-2\">Local pressure effects; usually curable by excision</td><td class=\"border p-2\">Recurrence, cachexia, death if untreated</td></tr>\n  </tbody>\n</table>\n\n<h3>Routes of Spread of tumour & their mechanism</h3>\n\n<h4>1. Local / Direct Invasion</h4>\n<ul>\n  <li>Progressive infiltration, permeation and destruction of surrounding tissue \u2014 easiest route, occurs first.</li>\n  <li>Tumour cells lose <strong>E-cadherin</strong> (cell\u2013cell adhesion), secrete proteases (MMP-2, MMP-9), and migrate through degraded ECM.</li>\n  <li>Clinical e.g. \u2014 carcinoma rectum invading bladder / prostate.</li>\n</ul>\n\n<h4>2. Lymphatic Spread</h4>\n<ul>\n  <li>Most common route for <strong>carcinomas</strong>. Tumour emboli enter lymphatics \u2192 regional nodes (sentinel node first).</li>\n  <li>Mechanism: tumour cells express <strong>chemokine receptor CCR7</strong> which binds CCL21 on lymphatic endothelium.</li>\n  <li>Examples \u2014 carcinoma breast \u2192 axillary nodes; carcinoma stomach \u2192 Virchow's node (Troisier's sign).</li>\n</ul>\n\n<h4>3. Haematogenous Spread</h4>\n<ul>\n  <li>Typical of <strong>sarcomas</strong>, but also seen with carcinomas (renal cell, hepatocellular, follicular thyroid, choriocarcinoma).</li>\n  <li>Tumour cells invade thin-walled venules; emboli lodge in the <strong>first capillary bed</strong> encountered \u2014 liver (GIT), lungs (systemic), vertebral veins (Batson's plexus, no valves \u2192 pelvic tumours to spine).</li>\n</ul>\n\n<h4>4. Transcoelomic / Seeding</h4>\n<ul>\n  <li>Spread across body cavities \u2014 most characteristically the peritoneum.</li>\n  <li><strong>Krukenberg tumour</strong> \u2014 bilateral ovarian metastasis from gastric / colon signet-ring carcinoma.</li>\n  <li><strong>Pseudomyxoma peritonei</strong> \u2014 mucinous carcinoma of appendix seeding peritoneum.</li>\n</ul>\n\n<h4>5. Implantation / Iatrogenic</h4>\n<ul>\n  <li>Tumour cells deposited along needle tract or surgical scar \u2014 e.g. seeding after laparoscopic biopsy of mesothelioma.</li>\n</ul>\n\n<div class=\"mermaid\">\nflowchart TD\n    A[Primary Tumour Cell] -->|Loss of E-cadherin| B[Detachment]\n    B -->|MMP-2 / MMP-9| C[ECM Degradation]\n    C --> D{Route of spread}\n    D -->|Direct| E[Local Invasion]\n    D -->|Lymphatic CCR7-CCL21| F[Regional Lymph Node]\n    D -->|Venule invasion| G[Haematogenous - Liver / Lung / Bone]\n    D -->|Body cavity| H[Transcoelomic Seeding]\n    D -->|Instrument / needle| I[Implantation]\n    E & F & G & H & I --> J[Secondary Deposit / Metastasis]\n</div>\n\n<img src=\"https://placehold.co/600x400?text=Benign+vs+Malignant+Histology\" alt=\"Benign vs malignant histology comparison diagram\">\n\n<h3>Clinical Pearls</h3>\n<ul>\n  <li><strong>\"Carcinomas love lymphatics, sarcomas love blood.\"</strong> Exception: renal cell, hepatocellular, follicular thyroid carcinomas prefer blood.</li>\n  <li>Sentinel lymph node biopsy (using methylene blue / Tc-99) is the standard of care in breast cancer & melanoma staging.</li>\n  <li>Batson's vertebral venous plexus explains why prostate cancer metastasises to lumbar spine without pulmonary involvement.</li>\n</ul>\n"
              },
              {
                id: "q0_0_0_1",
                subject: "Pathology",
                paper: "Paper-1",
                section: "15 Markers (Long Essays / LAQs)",
                marks: 15,
                question: "Define thrombosis. Write in detail about etiopathogenesis, morphology and consequences of Thrombosis.",
                answer: "\n<h3>Definition</h3>\n<p><strong>Thrombosis</strong> is the formation of a solid mass (<em>thrombus</em>) from the constituents of the flowing blood, <strong>within the vascular tree</strong>, during life. Mass formed after death = post-mortem clot; formed outside vasculature = haematoma. The distinction matters legally and diagnostically.</p>\n\n<h3>Virchow's Triad \u2014 the Etiopathogenesis</h3>\n<p>Every cause of thrombosis eventually acts through one (or more) of Virchow's three pillars. Memorise the triad first \u2014 the rest follows.</p>\n<table class=\"w-full text-sm border-collapse my-3\">\n  <thead class=\"bg-slate-100 dark:bg-slate-700\">\n    <tr><th class=\"border p-2 text-left\">Pillar</th><th class=\"border p-2 text-left\">Mechanism</th><th class=\"border p-2 text-left\">Clinical Examples</th></tr>\n  </thead>\n  <tbody>\n    <tr><td class=\"border p-2\">1. Endothelial injury</td><td class=\"border p-2\">Loss of anti-thrombotic (NO, PGI2, thrombomodulin, heparan sulfate); exposes subendothelial collagen &amp; vWF</td><td class=\"border p-2\">Atherosclerosis, hypertension, hyperhomocysteinaemia, smoking, radiation, indwelling catheters</td></tr>\n    <tr><td class=\"border p-2\">2. Stasis / Turbulence</td><td class=\"border p-2\">Disrupts laminar flow \u2192 platelets contact endothelium; inhibits dilution of clotting factors; reduces clearance of activated factors by liver</td><td class=\"border p-2\">Bed rest, immobilisation, prolonged travel, CHF, AFib, varicose veins, post-op</td></tr>\n    <tr><td class=\"border p-2\">3. Hypercoagulability</td><td class=\"border p-2\">\u2191 procoagulants or \u2193 anticoagulants</td><td class=\"border p-2\">Primary: Factor V Leiden, Prothrombin G20210A, AT-III / Protein C/S deficiency. Secondary: malignancy (Trousseau), pregnancy, OCPs, nephrotic syndrome, APS</td></tr>\n  </tbody>\n</table>\n\n<div class=\"mermaid\">\nflowchart LR\n    A[Virchow Triad] --> B1[Endothelial Injury]\n    A --> B2[Stasis / Turbulence]\n    A --> B3[Hypercoagulability]\n    B1 --> C[Platelet adhesion<br/>via vWF - GP Ib]\n    C --> D[Platelet activation<br/>release ADP, TXA2]\n    D --> E[Platelet aggregation<br/>fibrinogen - GP IIb/IIIa]\n    B3 --> F[Coagulation cascade<br/>Tissue Factor \u2192 Extrinsic \u2192 Common]\n    F --> G[Thrombin generation]\n    G --> H[Fibrin polymerisation]\n    E & H --> I[THROMBUS]\n</div>\n\n<h3>Morphology</h3>\n<h4>Arterial (White) Thrombus</h4>\n<ul>\n  <li>Formed in high-flow system \u2014 predominantly <strong>platelets + fibrin</strong>, pale, firm.</li>\n  <li>Lines of Zahn \u2014 alternating pale platelet layers and dark RBC layers (only seen in post-mortem clots in heart, but pathognomonic of true thrombus).</li>\n  <li>Usually <strong>mural</strong> (attached to wall) at sites of endothelial injury \u2014 e.g. over atherosclerotic plaque.</li>\n</ul>\n<h4>Venous (Red) Thrombus</h4>\n<ul>\n  <li>Formed in slow-flow system \u2014 predominantly <strong>RBCs enmeshed in fibrin</strong>, dark red, gelatinous.</li>\n  <li>No lines of Zahn typically. Almost always <strong>occlusive</strong>; propagates toward the heart.</li>\n  <li>Classic location: deep veins of leg (DVT).</li>\n</ul>\n<h4>Special morphologies</h4>\n<ul>\n  <li><strong>Mural thrombus</strong> \u2014 attached to wall of heart / aorta, non-occlusive (post-MI, aneurysm).</li>\n  <li><strong>Valvular vegetations</strong> \u2014 infective (large, friable, destroy valve) vs non-bacterial thrombotic (marantic, sterile, in malignancy).</li>\n  <li><strong>Microthrombi</strong> \u2014 DIC, TTP/HUS; widespread capillary hyaline thrombi.</li>\n</ul>\n\n<h3>Consequences \u2014 by site</h3>\n<ul>\n  <li><strong>Coronary artery</strong> \u2192 MI; <strong>carotid / cerebral</strong> \u2192 ischaemic stroke; <strong>mesenteric</strong> \u2192 bowel infarction.</li>\n  <li><strong>DVT</strong> \u2192 leg swelling, pain (Homan's sign \u2014 unreliable now); main danger = <strong>pulmonary embolism</strong>.</li>\n  <li><strong>Portal vein</strong> \u2192 portal hypertension; <strong>hepatic vein</strong> \u2192 Budd-Chiari.</li>\n  <li><strong>Disseminated (DIC)</strong> \u2192 consumptive coagulopathy \u2192 bleeding + microvascular thrombosis.</li>\n</ul>\n\n<h3>Fate of Thrombus</h3>\n<ol>\n  <li><strong>Resolution</strong> \u2014 complete lysis by plasmin (best outcome).</li>\n  <li><strong>Propagation</strong> \u2014 enlarges proximally (danger of embolisation).</li>\n  <li><strong>Organisation</strong> \u2014 ingrowth of granulation tissue; may recanalise \u2192 restore some flow.</li>\n  <li><strong>Embolisation</strong> \u2014 detached fragment travels downstream (PE, stroke, limb ischaemia).</li>\n</ol>\n\n<img src=\"https://placehold.co/600x400?text=Arterial+vs+Venous+Thrombus+Morphology\" alt=\"Thrombus morphology comparison\">\n\n<h3>Clinical pearl</h3>\n<p><strong>Trousseau's syndrome</strong> \u2014 migratory superficial thrombophlebitis in occult visceral malignancy (classically pancreatic carcinoma). One of the few bedside signs that should prompt an aggressive hunt for cancer.</p>\n"
              },
              {
                id: "q0_0_0_2",
                subject: "Pathology",
                paper: "Paper-1",
                section: "15 Markers (Long Essays / LAQs)",
                marks: 15,
                question: "Differentiate between benign and malignant tumors based on clinical and histological features. Describe the routes of metastasis with suitable examples. Explain the molecular mechanism of invasion and metastasis.",
                answer: "\n<h3>Clinical Differentiation \u2014 Benign vs Malignant</h3>\n<table class=\"w-full text-sm border-collapse my-3\">\n  <thead class=\"bg-slate-100 dark:bg-slate-700\">\n    <tr><th class=\"border p-2 text-left\">Clinical Feature</th><th class=\"border p-2 text-left\">Benign</th><th class=\"border p-2 text-left\">Malignant</th></tr>\n  </thead>\n  <tbody>\n    <tr><td class=\"border p-2\">Onset</td><td class=\"border p-2\">Slow, often incidental</td><td class=\"border p-2\">Progressive, symptomatic</td></tr>\n    <tr><td class=\"border p-2\">Margins</td><td class=\"border p-2\">Well-defined, mobile, encapsulated</td><td class=\"border p-2\">Irregular, fixed to surrounding tissue</td></tr>\n    <tr><td class=\"border p-2\">Pain</td><td class=\"border p-2\">Rare (unless compressing nerve)</td><td class=\"border p-2\">Often present (nerve infiltration, capsule stretching)</td></tr>\n    <tr><td class=\"border p-2\">Systemic symptoms</td><td class=\"border p-2\">None; weight preserved</td><td class=\"border p-2\">Weight loss, anorexia, cachexia, fatigue (TNF-\u03b1, IL-6)</td></tr>\n    <tr><td class=\"border p-2\">Vessels</td><td class=\"border p-2\">Well-formed, not friable</td><td class=\"border p-2\">Neovascular, leaky, tortuous \u2014 bleed easily</td></tr>\n    <tr><td class=\"border p-2\">Recurrence after excision</td><td class=\"border p-2\">Rare</td><td class=\"border p-2\">Frequent</td></tr>\n  </tbody>\n</table>\n\n<h3>Histological Differentiation</h3>\n<table class=\"w-full text-sm border-collapse my-3\">\n  <thead class=\"bg-slate-100 dark:bg-slate-700\">\n    <tr><th class=\"border p-2 text-left\">Histology</th><th class=\"border p-2 text-left\">Benign</th><th class=\"border p-2 text-left\">Malignant</th></tr>\n  </thead>\n  <tbody>\n    <tr><td class=\"border p-2\">Pleomorphism</td><td class=\"border p-2\">Mild / absent</td><td class=\"border p-2\">Marked \u2014 variation in size/shape</td></tr>\n    <tr><td class=\"border p-2\">N:C ratio</td><td class=\"border p-2\">Normal (1:4 to 1:6)</td><td class=\"border p-2\">Increased (1:1)</td></tr>\n    <tr><td class=\"border p-2\">Hyperchromatism</td><td class=\"border p-2\">Mild</td><td class=\"border p-2\">Marked (\u2191 chromatin)</td></tr>\n    <tr><td class=\"border p-2\">Nucleolus</td><td class=\"border p-2\">Inconspicuous</td><td class=\"border p-2\">Prominent, may be multiple</td></tr>\n    <tr><td class=\"border p-2\">Mitoses</td><td class=\"border p-2\">Rare, normal</td><td class=\"border p-2\">Numerous, atypical (tripolar, ring forms)</td></tr>\n    <tr><td class=\"border p-2\">Necrosis</td><td class=\"border p-2\">Absent</td><td class=\"border p-2\">Common (comedo necrosis in DCIS)</td></tr>\n    <tr><td class=\"border p-2\">Capsule</td><td class=\"border p-2\">Present, true capsule</td><td class=\"border p-2\">Absent; infiltrative margin</td></tr>\n  </tbody>\n</table>\n\n<h3>Routes of Metastasis \u2014 with Examples</h3>\n<ul>\n  <li><strong>Lymphatic</strong> \u2014 carcinomas (breast \u2192 axillary nodes; lung \u2192 hilar &amp; mediastinal nodes).</li>\n  <li><strong>Haematogenous</strong> \u2014 sarcomas &amp; select carcinomas (renal cell \u2192 renal vein \u2192 IVC \u2192 lungs; follicular thyroid \u2192 bone; hepatocellular \u2192 portal &amp; hepatic veins).</li>\n  <li><strong>Transcoelomic</strong> \u2014 ovarian Krukenberg (from stomach); pseudomyxoma peritonei (appendix).</li>\n  <li><strong>CSF / Subarachnoid</strong> \u2014 medulloblastoma drop metastases to spinal cord.</li>\n  <li><strong>Iatrogenic implantation</strong> \u2014 needle-tract seeding (mesothelioma, HCC).</li>\n</ul>\n\n<h3>Molecular Mechanism of Invasion &amp; Metastasis</h3>\n<p>Metastasis is an <strong>inefficient, multi-step cascade</strong> \u2014 most circulating tumour cells die; only ~0.01% seed a successful colony. Each step must succeed.</p>\n\n<div class=\"mermaid\">\nflowchart TD\n    A[Primary tumour<br/>loosening] -->|\u2193 E-cadherin| B[Detachment]\n    B -->|MMP-2, MMP-9, Cathepsin| C[ECM degradation<br/>Basement membrane]\n    C -->|Autocrine chemotaxis| D[Locomotion<br/>Pseudopodia]\n    D --> E[Intravasation<br/>through venule wall]\n    E --> F[Circulating Tumour Cells<br/>coated with platelets]\n    F -->|Arrest on capillary bed| G[Adhesion to endothelium<br/>via CD44, selectins]\n    G --> H[Extravasation<br/>into parenchyma]\n    H --> I[Pre-metastatic niche<br/>VEGF, CXCL12]\n    I --> J[Colonisation & Angiogenesis<br/>dormant or proliferative]\n    J -->|Success| K[Clinical Metastasis]\n    J -->|Failure| L[Apoptosis / Dormancy]\n</div>\n\n<h4>Key molecular players</h4>\n<ul>\n  <li><strong>E-cadherin loss</strong> \u2014 hallmark of epithelial\u2013mesenchymal transition (EMT); cells dissociate.</li>\n  <li><strong>MMPs (matrix metalloproteinases)</strong> \u2014 cleave collagen IV of basement membrane; <em>inhibited by TIMPs</em>.</li>\n  <li><strong>Integrins (\u03b13\u03b21, \u03b1v\u03b23)</strong> \u2014 transmit motility signals, bind ECM components.</li>\n  <li><strong>VEGF</strong> \u2014 drives tumour angiogenesis (Folkman's hypothesis \u2014 tumour cannot grow beyond 1\u20132 mm\u00b2 without blood supply).</li>\n  <li><strong>CXCR4\u2013CXCL12 axis</strong> \u2014 explains organ-specific homing (e.g. breast cancer \u2192 bone, liver, lung, brain).</li>\n  <li><strong>\"Seed and Soil\" hypothesis (Paget, 1889)</strong> \u2014 metastasis occurs only when compatible seed lands on hospitable soil (organ microenvironment).</li>\n</ul>\n\n<img src=\"https://placehold.co/600x400?text=Invasion+and+Metastasis+Cascade\" alt=\"Molecular mechanism of invasion and metastasis\">\n\n<h3>Clinical Pearl</h3>\n<p>Not every malignant tumour metastasises \u2014 basal cell carcinoma of skin is <em>locally invasive but virtually never metastasises</em>, while small cell lung carcinoma has often disseminated at presentation. This biological behaviour guides treatment intensity.</p>\n"
              },

                id: "q0_0_0_3",
                subject: "Pathology",

                section: "15 Markers (Long Essays / LAQs)",

                question: "Define amyloidosis. Classify amyloidosis. Discuss the etiopathogenesis, morphology, clinical features, diagnosis, and complications of amyloidosis.",
                answer: "\n<h3>Definition</h3>\n<p><strong>Amyloidosis</strong> is a heterogeneous group of disorders characterised by extracellular deposition of insoluble, fibrillar <strong>\u03b2-pleated sheet</strong> proteinaceous material \u2014 <em>amyloid</em> \u2014 that exhibits:</p>\n<ul>\n  <li><strong>Congophilia</strong> \u2014 stains pink with Congo red; shows <strong>apple-green birefringence</strong> under polarised light (gold standard for diagnosis).</li>\n  <li>Fibrillar appearance on EM (7.5\u201310 nm, non-branching).</li>\n  <li>\u03b2-pleated sheet conformation confirmed by X-ray diffraction & infra-red spectroscopy.</li>\n</ul>\n\n<h3>Composition of Amyloid</h3>\n<ul>\n  <li><strong>Fibril protein</strong> (90%) \u2014 varies by type (AL, AA, ATTR etc.).</li>\n  <li><strong>P-component</strong> (~5%) \u2014 glycoprotein, derived from serum amyloid P (SAP); protects fibrils from proteolysis.</li>\n  <li><strong>Glycosaminoglycans</strong> \u2014 heparan sulfate.</li>\n</ul>\n\n<h3>Classification (Modern \u2014 Biochemical)</h3>\n<table class=\"w-full text-sm border-collapse my-3\">\n  <thead class=\"bg-slate-100 dark:bg-slate-700\">\n    <tr><th class=\"border p-2 text-left\">Type</th><th class=\"border p-2 text-left\">Precursor Protein</th><th class=\"border p-2 text-left\">Clinical Setting</th></tr>\n  </thead>\n  <tbody>\n    <tr><td class=\"border p-2\"><strong>AL</strong> (Primary)</td><td class=\"border p-2\">Immunoglobulin light chains (\u03bb &gt; \u03ba)</td><td class=\"border p-2\">Plasma cell dyscrasia \u2014 multiple myeloma, MGUS, B-cell lymphoma</td></tr>\n    <tr><td class=\"border p-2\"><strong>AA</strong> (Secondary)</td><td class=\"border p-2\">Serum amyloid A (acute-phase reactant)</td><td class=\"border p-2\">Chronic inflammation \u2014 TB, rheumatoid arthritis, IBD, bronchiectasis, familial Mediterranean fever</td></tr>\n    <tr><td class=\"border p-2\"><strong>ATTR</strong> (Hereditary / Familial)</td><td class=\"border p-2\">Transthyretin (TTR)</td><td class=\"border p-2\">Familial amyloid polyneuropathy; wild-type (senile cardiac) ATTR</td></tr>\n    <tr><td class=\"border p-2\"><strong>A\u03b22M</strong></td><td class=\"border p-2\">\u03b22-microglobulin</td><td class=\"border p-2\">Long-term haemodialysis \u2014 carpal tunnel, arthropathy</td></tr>\n    <tr><td class=\"border p-2\"><strong>A\u03b2</strong></td><td class=\"border p-2\">Amyloid \u03b2 peptide (A4)</td><td class=\"border p-2\">Alzheimer disease, Down syndrome (after age 40)</td></tr>\n    <tr><td class=\"border p-2\">Endocrine</td><td class=\"border p-2\">Procalcitonin / calcitonin, ANP</td><td class=\"border p-2\">Medullary carcinoma thyroid, type 2 diabetes, atria of elderly</td></tr>\n  </tbody>\n</table>\n\n<div class=\"mermaid\">\nflowchart TD\n    A[Chronic Inflammation / Plasma cell dyscrasia / Mutant TTR] --> B[Precursor protein]\n    B --> C[Proteolytic cleavage / Misfolding]\n    C --> D[\u03b2-pleated sheet fibril]\n    D --> E[Aggregation with P-component & GAGs]\n    E --> F[Extracellular amyloid deposit]\n    F --> G[Tissue architectural disruption]\n    F --> H[Vascular infiltration \u2192 ischaemia]\n    G & H --> I[Organ dysfunction]\n</div>\n\n<h3>Morphology</h3>\n<h4>Gross</h4>\n<ul>\n  <li>Affected organs appear enlarged, <strong>pale, waxy, firm</strong> (\"lardaceous\" / \"bacon-like\" appearance).</li>\n  <li>Cut surface shows homogeneous, translucent, grey-pink material.</li>\n  <li>Liver, spleen, kidney classically enlarged.</li>\n</ul>\n<h4>Microscopy (H&E)</h4>\n<ul>\n  <li>Extracellular, <strong>amorphous, eosinophilic</strong> (pink) hyaline material in:</li>\n  <li><strong>Vessels</strong> \u2014 walls of small arteries & arterioles (universal early site).</li>\n  <li><strong>Spleen</strong> \u2014 two patterns: <em>sago</em> (follicular, tapioca-like) or <em>lardaceous</em> (diffuse red pulp).</li>\n  <li><strong>Liver</strong> \u2014 begins in space of Disse, extends into sinusoids, compresses hepatocytes.</li>\n  <li><strong>Kidney</strong> \u2014 glomerular mesangium &amp; capillary walls; classically <strong>nephrotic syndrome</strong>.</li>\n</ul>\n<h4>Special Stains</h4>\n<ul>\n  <li><strong>Congo red</strong> \u2192 pink (light), <strong>apple-green birefringence</strong> (polarised) \u2014 diagnostic.</li>\n  <li><strong>Thioflavin T</strong> \u2192 yellow-green fluorescence.</li>\n  <li><strong>Crystal violet</strong> \u2192 metachromatic rose-pink.</li>\n  <li><strong>Immunohistochemistry</strong> with anti-\u03bb, anti-\u03ba, anti-AA \u2014 to type the amyloid.</li>\n</ul>\n\n<h3>Clinical Features (by organ)</h3>\n<ul>\n  <li><strong>Renal</strong> \u2014 proteinuria \u2192 nephrotic syndrome \u2192 progressive renal failure (commonest cause of death).</li>\n  <li><strong>Cardiac</strong> \u2014 restrictive cardiomyopathy, arrhythmias, heart failure (common in AL & senile ATTR).</li>\n  <li><strong>GI</strong> \u2014 macroglossia (classic AL sign), hepatosplenomegaly, malabsorption, pseudo-obstruction.</li>\n  <li><strong>Neuro</strong> \u2014 peripheral &amp; autonomic neuropathy (ATTR, AL); carpal tunnel (A\u03b22M, ATTR).</li>\n  <li><strong>Mucocutaneous</strong> \u2014 periorbital purpura (\"raccoon eyes\", pathognomonic of AL), easy bruising (factor X binds amyloid).</li>\n</ul>\n\n<h3>Diagnosis</h3>\n<ol>\n  <li><strong>Biopsy</strong> of involved organ (renal, cardiac, liver) \u2014 gold standard.</li>\n  <li><strong>Subcutaneous fat aspiration / rectal biopsy</strong> \u2014 less invasive; ~80% sensitivity in systemic disease.</li>\n  <li><strong>Congo red staining + polarised microscopy</strong> \u2014 confirmatory.</li>\n  <li><strong>Mass spectrometry (LC-MS/MS)</strong> \u2014 modern gold standard for typing after laser microdissection.</li>\n  <li><strong>SAP scintigraphy</strong> \u2014 maps organ distribution (less useful in cardiac).</li>\n  <li>Work-up for underlying cause \u2014 serum/urine <strong>immunofixation electrophoresis</strong> (M-band in AL), serum <strong>free light chain assay</strong>, marrow biopsy; CRP/ESR for AA; TTR gene sequencing for hereditary ATTR.</li>\n</ol>\n\n<h3>Complications</h3>\n<ul>\n  <li>End-stage renal disease requiring dialysis/transplant.</li>\n  <li>Restrictive cardiomyopathy, sudden cardiac death (arrhythmia).</li>\n  <li>Hepatic failure, malnutrition (GI infiltration).</li>\n  <li>Death \u2014 untreated systemic AL amyloidosis: median survival 6\u201315 months from diagnosis.</li>\n</ul>\n\n<img src=\"https://placehold.co/600x400?text=Amyloid+Congo+Red+Apple+Green+Birefringence\" alt=\"Congo red apple-green birefringence photomicrograph\">\n\n<h3>Clinical Pearl</h3>\n<p>Suspect amyloidosis in any patient with nephrotic syndrome + non-diabetic restrictive cardiomyopathy + macroglossia. The triad of \"<strong>proteinuria, periorbital purpura, and a raised M-band</strong>\" is a near-pathognomonic bedside presentation of AL amyloidosis.</p>\n"
              },
              {
                id: "q0_0_0_4",
                subject: "Pathology",
                paper: "Paper-1",
                section: "15 Markers (Long Essays / LAQs)",

                question: "A patient with systemic lupus erythematosus: Write probable diagnosis, Etiology, pathogenesis, Gross and microscopic changes.",
                answer: "\n<h3>Probable Diagnosis</h3>\n<p><strong>Systemic Lupus Erythematosus (SLE)</strong> \u2014 a chronic, multisystem, autoimmune connective tissue disease characterised by production of autoantibodies against nuclear antigens (ANA), immune complex deposition, and a relapsing\u2013remitting course predominantly affecting women of childbearing age (F:M = 9:1).</p>\n\n<h3>Etiology \u2014 Multifactorial</h3>\n<ul>\n  <li><strong>Genetic</strong> \u2014 HLA-DR2, HLA-DR3; C1q, C2, C4 deficiency ( homozygous deficiency \u2192 90% lifetime risk of lupus-like illness); twin concordance ~25% monozygotic vs 2% dizygotic.</li>\n  <li><strong>Hormonal</strong> \u2014 female predominance; oestrogen enhances B-cell autoimmunity; flares in pregnancy & with OCPs.</li>\n  <li><strong>Environmental triggers</strong>:\n    <ul>\n      <li><strong>UV light</strong> \u2014 induces keratinocyte apoptosis \u2192 exposure of nuclear antigens.</li>\n      <li><strong>Drugs</strong> \u2014 procainamide, hydralazine, isoniazid, anti-TNF \u2192 drug-induced lupus (anti-histone +).</li>\n      <li><strong>Infections</strong> \u2014 EBV seroprevalence near 100% in paediatric SLE.</li>\n    </ul>\n  </li>\n  <li><strong>Immune dysregulation</strong> \u2014 defective clearance of apoptotic bodies, polyclonal B-cell activation, T-helper bias.</li>\n</ul>\n\n<h3>Pathogenesis</h3>\n<div class=\"mermaid\">\nflowchart TD\n    A[Genetic susceptibility + Trigger e.g. UV] --> B[Defective clearance of apoptotic bodies]\n    B --> C[Accumulation of nuclear material]\n    C --> D[Activation of autoreactive B & T cells]\n    D --> E[Autoantibody production<br/>ANA, anti-dsDNA, anti-Sm, anti-phospholipid]\n    E --> F[Immune complex formation]\n    F --> G[Circulating immune complexes]\n    G --> H[Deposition in tissues<br/>glomeruli, skin, serosa, vessels]\n    H --> I[Complement activation<br/>C3a, C5a, MAC]\n    I --> J[Inflammation, tissue damage]\n    J --> K[Clinical lesions \u2014 glomerulonephritis, malar rash, serositis, vasculitis]\n    F --> L[Type II hypersensitivity<br/>cytopenias - haemolytic anaemia, thrombocytopenia]\n</div>\n\n<p>Key pathogenetic triad: <strong>(1) autoantibodies</strong>, <strong>(2) immune complexes</strong>, <strong>(3) complement activation & tissue inflammation</strong>.</p>\n\n<h3>Gross Pathology</h3>\n<ul>\n  <li><strong>Skin</strong> \u2014 erythematous, slightly raised malar (butterfly) rash sparing nasolabial fold; discoid lesions with scarring & follicular plugging.</li>\n  <li><strong>Kidney</strong> \u2014 may be normal sized or slightly enlarged; \"flea-bitten\" appearance if petechial haemorrhages; class IV has the most dramatic changes.</li>\n  <li><strong>Serosal surfaces</strong> \u2014 fibrinous or serous effusions (pleuritis, pericarditis).</li>\n  <li><strong>Spleen</strong> \u2014 moderate splenomegaly; \"onion-skin\" arteriolar thickening (pathognomonic on microscopy).</li>\n  <li><strong>Heart</strong> \u2014 Libman-Sacks verrucous vegetations on both sides of valves (especially mitral).</li>\n  <li><strong>Joints</strong> \u2014 deforming but <em>non-erosive</em> Jaccoud arthropathy.</li>\n</ul>\n\n<h3>Microscopy</h3>\n<h4>Skin (Lupus Band Test)</h4>\n<ul>\n  <li>Basement membrane \u2014 vacuolar degeneration of basal keratinocytes; epidermal atrophy.</li>\n  <li>Dermo-epidermal junction \u2014 granular deposit of IgG, IgM, C3 by immunofluorescence (positive lupus band test in lesional AND sun-exposed non-lesional skin of SLE).</li>\n</ul>\n<h4>Kidney \u2014 Lupus Nephritis (ISN/RPS Classification)</h4>\n<table class=\"w-full text-sm border-collapse my-3\">\n  <thead class=\"bg-slate-100 dark:bg-slate-700\">\n    <tr><th class=\"border p-2 text-left\">Class</th><th class=\"border p-2 text-left\">Pattern</th><th class=\"border p-2 text-left\">Histology</th></tr>\n  </thead>\n  <tbody>\n    <tr><td class=\"border p-2\">I</td><td class=\"border p-2\">Minimal mesangial</td><td class=\"border p-2\">Normal LM; immune deposits by IF/EM only</td></tr>\n    <tr><td class=\"border p-2\">II</td><td class=\"border p-2\">Mesangial proliferative</td><td class=\"border p-2\">Mesangial hypercellularity &amp; deposits</td></tr>\n    <tr><td class=\"border p-2\">III</td><td class=\"border p-2\">Focal proliferative</td><td class=\"border p-2\">&lt;50% glomeruli; segmental endocapillary proliferation, karyorrhexis (fibrinoid necrosis), \"wire-loop\" lesions</td></tr>\n    <tr><td class=\"border p-2\"><strong>IV</strong></td><td class=\"border p-2\"><strong>Diffuse proliferative (worst, commonest severe)</strong></td><td class=\"border p-2\">\u226550% glomeruli; wire-loop, hyaline thrombi, crescents; \"full-house\" IF</td></tr>\n    <tr><td class=\"border p-2\">V</td><td class=\"border p-2\">Membranous</td><td class=\"border p-2\">Diffuse thickening; subepithelial deposits \u2192 nephrotic syndrome</td></tr>\n    <tr><td class=\"border p-2\">VI</td><td class=\"border p-2\">Advanced sclerosing</td><td class=\"border p-2\">\u226590% global glomerulosclerosis</td></tr>\n  </tbody>\n</table>\n\n<h4>Other Micro Findings</h4>\n<ul>\n  <li><strong>\"Onion-skin\" splenic arterioles</strong> \u2014 concentric periarterial fibrosis; virtually pathognomonic of SLE.</li>\n  <li><strong>Libman-Sacks endocarditis</strong> \u2014 verrucae of fibrin, platelets, immune complexes on both sides of valve leaflets (distinguishes from rheumatic and infective endocarditis).</li>\n  <li><strong>Hyaline thrombi</strong> in small vessels \u2014 occasionally with TMA picture.</li>\n  <li><strong>Non-erosive synovitis</strong> \u2014 joints affected but cartilage preserved.</li>\n</ul>\n\n<img src=\"https://placehold.co/600x400?text=Wire+Loop+Lesion+Lupus+Nephritis\" alt=\"Wire-loop lesion in lupus nephritis\">\n\n<h3>Clinical Pearl \u2014 Diagnostic Criteria</h3>\n<p>Use the <strong>SLICC 2012</strong> or <strong>EULAR/ACR 2019</strong> criteria \u2014 \u22654 criteria (including \u22651 clinical &amp; \u22651 immunological) with a score \u226510 yields ~93% sensitivity &amp; specificity. ANA is the entry criterion. Anti-dsDNA &amp; anti-Sm are highly specific; anti-dsDNA titres also track disease activity &amp; nephritis.</p>\n"
              },
              {
                id: "q0_0_0_5",
                subject: "Pathology",
                paper: "Paper-1",
                section: "15 Markers (Long Essays / LAQs)",
                marks: 15,
                question: "A patient with septic shock: Write probable diagnosis, Etiology, pathogenesis, Gross and microscopic changes.",
                answer: "\n<h3>Probable Diagnosis</h3>\n<p><strong>Septic shock</strong> \u2014 a subset of distributive shock caused by a dysregulated host response to infection, presenting with <strong>circulatory, cellular & metabolic abnormalities</strong> and persisting hypotension requiring vasopressors despite adequate fluid resuscitation, with associated organ dysfunction (Sepsis-3 definition, JAMA 2016).</p>\n\n<h3>Etiology</h3>\n<ul>\n  <li><strong>Commonest organisms</strong> \u2014 Gram-negative bacilli (E. coli, Klebsiella, Pseudomonas) and Gram-positive cocci (S. aureus, S. pneumoniae, Enterococci) are now nearly equal in incidence.</li>\n  <li><strong>Fungal sepsis</strong> (Candida) \u2014 increasing in ICU & immunocompromised.</li>\n  <li><strong>Sources</strong> \u2014 genitourinary, respiratory, GI/biliary, skin/soft tissue, indwelling catheters, post-operative wounds.</li>\n  <li><strong>Risk factors</strong> \u2014 extremes of age, immunosuppression, diabetes, malignancy, malnutrition, burns, invasive devices, asplenia.</li>\n</ul>\n\n<h3>Pathogenesis \u2014 The \"Cytokine Storm\"</h3>\n<div class=\"mermaid\">\nflowchart TD\n    A[Infection / Microbial products<br/>LPS, PGN, CpG DNA] --> B[PRR recognition<br/>TLR4, TLR2, NLRs]\n    B --> C[Activation of monocytes/macrophages & endothelium]\n    C --> D[Massive cytokine release<br/>TNF-\u03b1, IL-1, IL-6, IL-8, IFN-\u03b3]\n    D --> E1[\u2191 NOS \u2192 NO overproduction]\n    D --> E2[\u2191 iNOS in vessels \u2192 vasodilation]\n    D --> E3[Endothelial activation & injury<br/>\u2191 adhesion molecules, glycocalyx shedding]\n    D --> E4[Complement & coagulation activation]\n    E1 & E2 --> F[Systemic vasodilation<br/>\u2193 SVR, refractory hypotension]\n    E3 --> G[Capillary leak \u2192 tissue oedema]\n    E4 --> H[Microvascular thrombosis \u2192 DIC]\n    F & G & H --> I[Maldistribution of blood flow<br/>regional hypoperfusion]\n    I --> J[Cellular hypoxia & mitochondrial dysfunction]\n    J --> K[Multi-Organ Dysfunction Syndrome - MODS]\n</div>\n\n<p>The fundamental lesion is <strong>not pump failure</strong> (like cardiogenic shock) but a <strong>maldistribution of blood flow</strong> with capillary leak, microthrombi and mitochondrial dysfunction \u2014 so patients often have a high cardiac output (\"warm shock\") initially before cardiovascular collapse.</p>\n\n<h3>Phases \u2014 Warm vs Cold Shock</h3>\n<ul>\n  <li><strong>Early (Warm) shock</strong> \u2014 vasodilated, flushed, warm peripheries, bounding pulse, widened pulse pressure, oliguria, altered mental state. Often missed at bedside.</li>\n  <li><strong>Late (Cold) shock</strong> \u2014 vasoconstriction kicks in secondarily; cold clammy skin, weak thready pulse, narrow pulse pressure, multi-organ failure. Mortality rises steeply.</li>\n</ul>\n\n<h3>Gross Pathology</h3>\n<ul>\n  <li>Non-specific \u2014 organs congested, oedematous.</li>\n  <li><strong>Lungs</strong> \u2014 heavy, congested, haemorrhagic; ARDS picture with hyaline membranes.</li>\n  <li><strong>Adrenals</strong> \u2014 bilateral haemorrhagic necrosis in <em>Waterhouse-Friderichsen syndrome</em> (meningococcaemia).</li>\n  <li><strong>GIT</strong> \u2014 patchy haemorrhagic necrosis (gut is the \"motor of multi-organ failure\").</li>\n  <li><strong>Spleen</strong> \u2014 may be enlarged (septic spleen) in subacute sepsis.</li>\n  <li><strong>Kidneys</strong> \u2014 acute tubular necrosis (gross: pale, swollen kidneys with muddy brown casts).</li>\n</ul>\n\n<h3>Microscopy</h3>\n<ul>\n  <li><strong>Microvascular thrombi</strong> \u2014 widespread capillary fibrin-platelet thrombi (DIC).</li>\n  <li><strong>Acute tubular necrosis</strong> \u2014 kidney tubular epithelial necrosis, muddy brown casts.</li>\n  <li><strong>Diffuse alveolar damage (DAD)</strong> \u2014 lungs show hyaline membranes, type II pneumocyte hyperplasia.</li>\n  <li><strong>Hepatic</strong> \u2014 centrilobular necrosis (zone 3) due to hypotension; cholestasis.</li>\n  <li><strong>Adrenal</strong> \u2014 haemorrhage &amp; necrosis (Waterhouse-Friderichsen).</li>\n  <li><strong>Disseminated Intravascular Coagulation</strong> \u2014 microthrombi in many organs; depletion of platelets &amp; clotting factors.</li>\n</ul>\n\n<h3>Organ Dysfunction Markers (qSOFA at Bedside)</h3>\n<ul>\n  <li>Respiratory rate \u2265 22/min</li>\n  <li>Altered mentation (GCS &lt; 15)</li>\n  <li>Systolic BP \u2264 100 mmHg</li>\n  <li>\u22652 of 3 \u2192 high risk of poor outcome; prompts sepsis work-up.</li>\n</ul>\n\n<img src=\"https://placehold.co/600x400?text=Septic+Shock+Pathogenesis+Cascade\" alt=\"Septic shock cytokine storm cascade\">\n\n<h3>Clinical Pearl</h3>\n<p><strong>\"Surviving Sepsis Campaign Hour-1 Bundle\"</strong>: within 1 hour of recognition \u2014 measure lactate, obtain blood cultures, administer broad-spectrum antibiotics, begin 30 mL/kg crystalloid for hypotension or lactate \u22654, start vasopressors if hypotensive during/after fluids. Early antibiotics (every hour delay = ~7\u20138% rise in mortality) is the single most modifiable factor.</p>\n"

                section: "15 Markers (Long Essays / LAQs)",
                marks: 15,
                question: "Describe the medical, legal, and ethical responsibilities of a doctor and how to counsel the family for organ donation in a brain dead patient.",
                answer: "\n<h3>Setting the Scene</h3>\n<p>A patient on ventilator with devastating brain injury has been certified <strong>brain-stem dead</strong>. The physician now has three interlocking duties \u2014 <strong>medical</strong> (confirm death &amp; maintain physiology for donation), <strong>legal</strong> (follow Transplantation of Human Organs Act, 1994), and <strong>ethical</strong> (autonomy, beneficence, non-maleficence, justice). Counselling the family for organ donation is woven through all three.</p>\n\n<h3>1. Medical Responsibilities</h3>\n<ul>\n  <li><strong>Diagnose brain-stem death</strong> using laid-down apnoea &amp; brain-stem reflex testing \u2014 performed by a panel of <strong>four physicians</strong> (in India, per THOA 1994 &amp; amendments): administrator-in-charge, a neurologist/neurosurgeon, the treating physician, and an independent registered medical practitioner. Two evaluations 6 hours apart are required; the second is legally the time of death.</li>\n  <li><strong>Maintain donor physiology</strong> \u2014 ventilatory support, normotension, normothermia (core &gt;35\u00b0C), euglycaemia, urine output &gt;1 mL/kg/h. Manage diabetes insipidus (DDAVP), correct electrolyte disturbances (hypernatraemia common).</li>\n  <li><strong>Avoid harm</strong> \u2014 discontinue futile interventions if family declines donation; continue dignified end-of-life care.</li>\n  <li><strong>Document meticulously</strong> \u2014 time, findings, panel signatures; chain of custody if organ retrieval planned.</li>\n</ul>\n\n<h3>2. Legal Responsibilities (India \u2014 THOA 1994, amended 2011 &amp; 2014)</h3>\n<ul>\n  <li><strong>Brain-stem death is legally recognised as death</strong> in India (THOA amended 2011, Section 2(d)). The patient is dead \u2014 there is no ethical conflict in withdrawing the ventilator after certification.</li>\n  <li><strong>Informed consent</strong> for organ retrieval must be obtained from the <strong>next of kin</strong> in writing on Form 8 (or equivalent state form). Consent must be voluntary, free of coercion, and specific to organs/tissues.</li>\n  <li><strong>Required consent hierarchy</strong>: spouse, then adult son/daughter, then parents, then sibling, then other legal guardian.</li>\n  <li><strong>Organ trafficking is a cognisable, non-bailable offence</strong> \u2014 punishable up to 10 years + fine. Doctors must never act as brokers between recipient and donor families (transplant coordinator, an independent functionary, is mandatory under THOA Rules 2014).</li>\n  <li><strong>Mandatory death certificate</strong> \u2014 issue in standard format, mention brain-stem death as cause where applicable.</li>\n  <li><strong>Confidentiality</strong> \u2014 donor and recipient identities are kept confidential from each other.</li>\n  <li><strong>Mandatory reporting</strong> to NOTTO/ROTTO/SOTTO registries for transparency.</li>\n</ul>\n\n<h3>3. Ethical Responsibilities</h3>\n<ul>\n  <li><strong>Autonomy</strong> \u2014 respect the prior wishes of the deceased (donor card, family-aware directives) and of the family now.</li>\n  <li><strong>Beneficence</strong> \u2014 transplantation can save up to 8 lives (kidneys \u00d72, liver, heart, lungs \u00d72, pancreas, small bowel) and enhance many more via tissues (cornea, skin, bone, heart valves). Frame donation as a positive legacy.</li>\n  <li><strong>Non-maleficence</strong> \u2014 do not hasten death to retrieve organs; the <strong>Dead Donor Rule</strong> is inviolable \u2014 retrieval must not begin before death certification.</li>\n  <li><strong>Justice</strong> \u2014 fair allocation via NOTTO waitlist on objective criteria (blood group, HLA match, urgency, waiting time, age) \u2014 never wealth, social status, or influence.</li>\n  <li><strong>Cultural & religious sensitivity</strong> \u2014 many families have concerns about bodily integrity in afterlife; approach with humility, not persuasion.</li>\n</ul>\n\n<h3>4. Counselling the Family for Organ Donation \u2014 A Step-by-Step Approach</h3>\n<div class=\"mermaid\">\nflowchart TD\n    A[Breaking bad news - SPIKES protocol] --> B[Allow grief reaction - silence, time, tissues]\n    B --> C[Confirm understanding of brain-stem death<br/>avoid jargon; 'death of brain, heart still beating on machine']\n    C --> D{Family accepts concept of death?}\n    D -->|No - denial| E[Re-explain, offer spiritual counsellor, second opinion]\n    D -->|Yes| F[Introduce option of organ donation<br/>separate from death declaration - decouple]\n    F --> G[Use plain language - 'gift of life', save up to 8 lives]\n    G --> H[Address fears - body disfigurement, religious objection, cost]\n    H --> I[Transplant coordinator joins<br/>- explains procedure, paperwork, NOTTO registry]\n    I --> J{Family decision}\n    J -->|Consent| K[Sign Form 8; activate retrieval team]\n    J -->|Decline| L[Respect decision; continue dignified end-of-life care; no coercion]\n</div>\n\n<h4>Practical counselling principles</h4>\n<ul>\n  <li><strong>\"Decoupling\"</strong> \u2014 first communicate death clearly and let it sink in. Only after the family accepts the reality of death, raise the topic of donation. Combining the two is emotionally confusing and reduces consent rates.</li>\n  <li><strong>SPIKES protocol</strong> for breaking bad news: Setting, Perception (ask what they understand), Invitation (how much detail they want), Knowledge (give the news in small chunks), Emotions (acknowledge), Strategy & Summary.</li>\n  <li>Use the transplant coordinator \u2014 a trained, neutral professional \u2014 for the actual donation conversation. Doctors tend to be perceived as \"rushing\"; coordinators improve consent rates by ~30%.</li>\n  <li>Address common fears directly: <em>\"Will the body be disfigured?\"</em> (No \u2014 surgical incisions are closed like any operation; can view body afterwards); <em>\"Will it cost us?\"</em> (No \u2014 all costs borne by retrieval hospital/recipient); <em>\"Is my religion against it?\"</em> (No major religion opposes organ donation; many actively endorse it).</li>\n  <li>Document consent clearly, including which specific organs are consented \u2014 family may consent to corneas only and decline solid organs; respect that.</li>\n  <li>Offer bereavement support follow-up; share outcome (which recipient received which organ) after a few weeks if family wishes \u2014 this often helps grieving.</li>\n</ul>\n\n<h3>5. Common Pitfalls & Medico-legal Risks</h3>\n<ul>\n  <li>Certifying brain-stem death without full panel or incomplete documentation \u2014 invalid in court.</li>\n  <li>Approaching family for donation before they have accepted death \u2014 perceived as pressure, reduces consent and risks complaint.</li>\n  <li>Conflict of interest \u2014 a member of the transplant team cannot be on the brain-stem death certification panel.</li>\n  <li>Continuing ventilator after refusal of donation without a clear plan \u2014 \"futile care\" communication breakdown causes medico-legal disputes.</li>\n</ul>\n\n<img src=\"https://placehold.co/600x400?text=Brain+Death+Certification+Panel+and+THOA+Workflow\" alt=\"Brain death certification and organ donation workflow diagram\">\n\n<h3>Clinical Pearl</h3>\n<p>India has an organ donation rate of only ~0.34 per million population (vs 30+ in Spain). The single largest modifiable factor is <strong>early, trained, decoupled counselling by a transplant coordinator</strong>. As the certifying physician, your job is to <em>diagnose death correctly, document it meticulously, and introduce the conversation gently</em> \u2014 not to persuade. Persuasion is a fine line that can quickly become coercion.</p>\n"
              }

                question: "Describe urine examination under Physical, Chemical and Microscopy with clinical significance.",
                answer: "\n<h3>Overview</h3>\n<p>Urinalysis is one of the oldest, cheapest, and most informative bedside investigations \u2014 a \"liquid biopsy\" of the kidney & urinary tract. A complete examination has three components: <strong>Physical, Chemical, and Microscopic</strong>.</p>\n\n<h3>1. Physical Examination</h3>\n<table class=\"w-full text-sm border-collapse my-3\">\n  <thead class=\"bg-slate-100 dark:bg-slate-700\">\n    <tr><th class=\"border p-2 text-left\">Parameter</th><th class=\"border p-2 text-left\">Normal</th><th class=\"border p-2 text-left\">Abnormal \u2014 Clinical Significance</th></tr>\n  </thead>\n  <tbody>\n    <tr><td class=\"border p-2\">Volume</td><td class=\"border p-2\">600\u20132000 mL/day</td><td class=\"border p-2\">\u2191 Polyuria (DM, DI, CKD); \u2193 Oliguria (&lt;400 mL/day), Anuria (&lt;100 mL/day)</td></tr>\n    <tr><td class=\"border p-2\">Colour</td><td class=\"border p-2\">Pale yellow / amber (urochrome)</td><td class=\"border p-2\">Red \u2014 haematuria, beeturia, porphyria, rifampicin; Brown \u2014 old blood, bilirubin; Smoky \u2014 glomerulonephritis; Milky \u2014 chyluria, pyuria</td></tr>\n    <tr><td class=\"border p-2\">Appearance / Turbidity</td><td class=\"border p-2\">Clear</td><td class=\"border p-2\">Cloudy \u2014 phosphates (alkaline), urates (acid), pyuria, chyluria; Frothy \u2014 proteinuria</td></tr>\n    <tr><td class=\"border p-2\">Odour</td><td class=\"border p-2\">Aromatic</td><td class=\"border p-2\">Pungent \u2014 ammonia (UTI); Fruity \u2014 ketones (DKA); Mousy \u2014 phenylketonuria; Maple syrup \u2014 maple syrup urine disease</td></tr>\n    <tr><td class=\"border p-2\">Specific gravity</td><td class=\"border p-2\">1.003\u20131.030</td><td class=\"border p-2\">\u2191 Dehydration, glycosuria, contrast; \u2193 DI, over-hydration; Fixed 1.010 \u2014 chronic renal disease (isosthenuria)</td></tr>\n    <tr><td class=\"border p-2\">pH</td><td class=\"border p-2\">4.5\u20138.0 (avg ~6, acidic)</td><td class=\"border p-2\">\u2191 Alkaline \u2014 UTI with urea-splitting organisms (Proteus), RTA type 1, vomiting; \u2193 Acidic \u2014 DKA, lactic acidosis, fever, diarrhoea</td></tr>\n  </tbody>\n</table>\n\n<h3>2. Chemical Examination</h3>\n<p>Modern dipsticks (e.g. Combur, Multistix) use dry chemistry pads read visually or by automated reader.</p>\n<ul>\n  <li><strong>pH</strong> \u2014 double indicator (methyl red / bromothymol blue).</li>\n  <li><strong>Specific gravity</strong> \u2014 ionic strength indicator (bromothymol blue).</li>\n  <li><strong>Protein</strong> \u2014 tetrabromophenol blue dye-binding; <em>detects mainly albumin</em> (false negative for Bence-Jones proteins \u2192 use sulphosalicylic acid test / protein electrophoresis).</li>\n  <li><strong>Glucose</strong> \u2014 glucose oxidase-peroxidase (GOD-POD); specific for glucose only. False + with peroxide cleaners; false \u2212 with high dose vitamin C.</li>\n  <li><strong>Ketones</strong> \u2014 sodium nitroprusside reaction with acetoacetate (not \u03b2-hydroxybutyrate).</li>\n  <li><strong>Blood / Haemoglobin</strong> \u2014 peroxidase-like activity of Hb / myoglobin lyses chromogen; intact RBCs produce speckled pattern; lysed RBCs / myoglobin produce uniform colour.</li>\n  <li><strong>Bilirubin</strong> \u2014 diazo reaction (2,4-dichloroaniline); absent in normal urine.</li>\n  <li><strong>Urobilinogen</strong> \u2014 Ehrlich aldehyde reaction; normally present in traces; absent in complete biliary obstruction; raised in haemolysis &amp; hepatocellular dysfunction.</li>\n  <li><strong>Nitrite</strong> \u2014 Greiss reaction; positive with nitrate-reducing bacteria (E. coli, Klebsiella, Proteus) \u2014 needs urine to dwell \u22654 h in bladder; first morning sample most useful.</li>\n  <li><strong>Leucocyte esterase</strong> \u2014 detects esterases from lysed WBCs; sensitive for pyuria.</li>\n</ul>\n\n<h3>3. Microscopic Examination</h3>\n<p>Performed on <strong>freshly voided, midstream, centrifuged urine</strong> (10 mL at 1500 rpm \u00d7 5 min), examined under low &amp; high power. Findings are reported per high-power field (HPF).</p>\n\n<h4>Cells</h4>\n<ul>\n  <li><strong>RBCs</strong> \u2014 &gt;3 RBC/HPF = haematuria. <em>Dysmorphic RBCs &amp; RBC casts</em> \u2192 glomerular bleeding; <em>Isomorphic RBCs</em> \u2192 urological cause (stones, tumour, infection).</li>\n  <li><strong>WBCs</strong> \u2014 &gt;5 WBC/HPF = pyuria. Sterile pyuria \u2014 TB, Chlamydia, gonococcus, stones, interstitial nephritis, partially treated UTI.</li>\n  <li><strong>Epithelial cells</strong> \u2014 squamous (contamination); transitional (catheterised, catheter-induced); renal tubular (ATN, acute interstitial nephritis, acute tubular injury).</li>\n  <li><strong>Oval fat bodies</strong> \u2014 lipid-laden renal tubular cells; \"Maltese cross\" appearance under polarised light \u2014 nephrotic syndrome.</li>\n</ul>\n\n<h4>Casts (formed in distal & collecting tubules; matrix = Tamm-Horsfall protein)</h4>\n<ul>\n  <li><strong>Hyaline</strong> \u2014 clear, colourless; normal after exercise, dehydration; nonspecific.</li>\n  <li><strong>Granular</strong> \u2014 degenerated tubular cells; \"muddy brown\" coarse granular casts \u2192 acute tubular necrosis.</li>\n  <li><strong>RBC casts</strong> \u2014 pathognomonic of glomerulonephritis (e.g. post-streptococcal, IgA nephropathy).</li>\n  <li><strong>WBC casts</strong> \u2014 acute pyelonephritis, acute interstitial nephritis.</li>\n  <li><strong>Broad waxy casts</strong> \u2014 formed in dilated tubules of chronically diseased kidney; chronic renal failure.</li>\n  <li><strong>Fatty casts</strong> \u2014 nephrotic syndrome.</li>\n</ul>\n\n<h4>Crystals</h4>\n<ul>\n  <li>Calcium oxalate (envelope / \"envelope\" appearance) \u2014 acidic urine; ethylene glycol poisoning shows envelope & needle forms.</li>\n  <li>Uric acid (rhomboid / \"whetstone\") \u2014 acidic urine; gout, tumour lysis.</li>\n  <li>Triple phosphate (\"coffin-lid\") \u2014 alkaline urine; Proteus UTI (struvite stones).</li>\n  <li>Cystine (hexagonal, benzene ring) \u2014 cystinuria.</li>\n  <li>Sulphonamide, radiographic contrast \u2014 drug-induced crystals with acute kidney injury.</li>\n</ul>\n\n<h4>Organisms</h4>\n<ul>\n  <li>Bacteria (rods / cocci) \u2014 UTI; confirm with culture &amp; sensitivity.</li>\n  <li>Trichomonas vaginalis, yeast (Candida), Schistosoma haematobium ova \u2014 depending on geography.</li>\n</ul>\n\n<div class=\"mermaid\">\nflowchart LR\n    A[Fresh MSU sample] --> B[Physical - colour / clarity / SG / pH]\n    A --> C[Chemical - dipstick 10 parameters]\n    A --> D[Centrifuge 5 min 1500 rpm]\n    D --> E[Sediment microscopy - cells / casts / crystals / organisms]\n    B & C & E --> F[Correlate with clinical picture]\n    F --> G[Diagnosis]\n</div>\n\n<img src=\"https://placehold.co/600x400?text=Urine+Microscopy+Cells+Casts+Crystals\" alt=\"Urine microscopy morphology chart\">\n\n<h3>Clinical Pearl</h3>\n<p>The combination <strong>\"dipstick protein + dysmorphic RBCs + RBC casts\"</strong> is the bedside fingerprint of <strong>glomerular disease</strong> and warrants urgent nephrology referral &amp; renal biopsy. Conversely, dipstick blood with <em>isomorphic</em> RBCs and <em>no</em> proteinuria points to a urological cause \u2014 investigate with imaging/cystoscopy, not biopsy.</p>\n"

              {

                question: "Describe the steps involved in migration of neutrophils from blood to the tissues.",
                answer: "\n<h3>Overview</h3>\n<p>Neutrophils are the <strong>first responders</strong> of acute inflammation. Their journey from the bloodstream into the tissue is described by a 5-step paradigm \u2014 each step governed by specific adhesion molecules and chemokines. Failure of any step produces immunodeficiency (e.g. <em>leucocyte adhesion deficiency type 1</em> due to CD18 deficiency \u2192 recurrent infections without pus).</p>\n\n<div class=\"mermaid\">\nflowchart TD\n    A[Margination] --> B[Rolling]\n    B --> C[Adhesion / Firm arrest]\n    C --> D[Transmigration / Diapedesis]\n    D --> E[Chemotaxis]\n    E --> F[Phagocytosis at site]\n</div>\n\n<h3>Step 1 \u2014 Margination</h3>\n<ul>\n  <li>In normal laminar flow, RBCs occupy the axial (central) stream and WBCs are pushed to the periphery \u2014 the \"plasma skimming\" effect.</li>\n  <li>With inflammation, vasodilation slows blood flow & increases viscosity \u2192 neutrophils settle against the endothelium (<strong>margination</strong>).</li>\n</ul>\n\n<h3>Step 2 \u2014 Rolling (Loose, Transient Adhesion)</h3>\n<ul>\n  <li><strong>Selectin family</strong> mediates weak, reversible binding \u2014 bond breaks & re-forms, so leucocytes \"roll\" along the endothelium.</li>\n  <li><strong>E-selectin</strong> (endothelium; induced by TNF-\u03b1 &amp; IL-1 within 2 hours).</li>\n  <li><strong>P-selectin</strong> (preformed in Weibel-Palade bodies; mobilised to surface within minutes by histamine &amp; thrombin).</li>\n  <li><strong>L-selectin</strong> (on neutrophil surface).</li>\n  <li>Ligands \u2014 sialyl-Lewis X on leucocytes; PSGL-1 (P-selectin glycoprotein ligand-1).</li>\n</ul>\n\n<h3>Step 3 \u2014 Adhesion / Firm Arrest</h3>\n<ul>\n  <li>Chemokines (IL-8, C5a, LTB4) activate neutrophils and trigger conformational change in <strong>integrins</strong> on the leucocyte surface \u2192 high-affinity binding.</li>\n  <li><strong>\u03b22 integrins (CD18)</strong> \u2014 LFA-1 (CD11a/CD18), Mac-1 (CD11b/CD18) on the neutrophil.</li>\n  <li>Ligands on endothelium \u2014 <strong>ICAM-1</strong> (inducible by TNF-\u03b1, IL-1) and <strong>ICAM-2</strong>.</li>\n  <li>This step is the tightest \u2014 once integrins bind ICAM-1, the neutrophil stops rolling and flattens.</li>\n</ul>\n\n<h3>Step 4 \u2014 Transmigration / Diapedesis</h3>\n<ul>\n  <li>Neutrophils crawl to intercellular junctions and squeeze between endothelial cells.</li>\n  <li>Mediated by <strong>PECAM-1 (CD31)</strong> \u2014 homophilic binding between endothelial &amp; leucocyte CD31.</li>\n  <li>Other molecules \u2014 VE-cadherin, CD99, JAM (junctional adhesion molecules).</li>\n  <li>The neutrophil then crosses the basement membrane by secreting <strong>collagenases (MMP-8, MMP-9)</strong> &amp; elastase.</li>\n</ul>\n\n<h3>Step 5 \u2014 Chemotaxis</h3>\n<ul>\n  <li>Directed migration along a chemical gradient toward the site of injury.</li>\n  <li><strong>Exogenous chemotaxins</strong> \u2014 bacterial products (N-formyl peptides like fMet-Leu-Phe).</li>\n  <li><strong>Endogenous chemotaxins</strong> \u2014 C5a, LTB4, IL-8, fibrinopeptides, platelet-activating factor (PAF).</li>\n  <li>Receptors \u2014 G-protein coupled receptors; ligand binding triggers actin polymerisation at the leading edge (pseudopod formation).</li>\n</ul>\n\n<h3>Step 6 \u2014 Phagocytosis (after arrival)</h3>\n<ul>\n  <li><strong>Recognition &amp; attachment</strong> \u2014 enhanced by <em>opsonins</em> (IgG, C3b); binds Fc\u03b3R &amp; CR1/CR3.</li>\n  <li><strong>Engulfment</strong> \u2014 pseudopods encircle the particle \u2192 phagosome \u2192 phagolysosome.</li>\n  <li><strong>Killing</strong> \u2014 two mechanisms:\n    <ul>\n      <li><strong>Oxygen-dependent</strong> \u2014 NADPH oxidase (respiratory burst) \u2192 superoxide \u2192 H\u2082O\u2082 \u2192 via MPO + Cl\u207b \u2192 hypochlorous acid (bleach). <em>Defect = chronic granulomatous disease.</em></li>\n      <li><strong>Oxygen-independent</strong> \u2014 lysozyme, lactoferrin, defensins, proteases, low pH.</li>\n    </ul>\n  </li>\n</ul>\n\n<h3>Clinical Correlations \u2014 When the Cascade Fails</h3>\n<ul>\n  <li><strong>LAD-1</strong> \u2014 CD18 deficiency; neutrophils can't bind ICAM-1 \u2192 no pus formation despite high neutrophil count; delayed umbilical stump separation.</li>\n  <li><strong>LAD-2</strong> \u2014 fucose transporter defect (Sialyl-Lewis X absent) \u2192 mentally retarded child with recurrent infections.</li>\n  <li><strong>Chronic Granulomatous Disease</strong> \u2014 NADPH oxidase defect \u2192 recurrent catalase-positive infections (S. aureus, Aspergillus, Serratia); diagnostic NBT/DHR test.</li>\n  <li><strong>Ch\u00e9diak-Higashi syndrome</strong> \u2014 giant lysosomal granules; defective chemotaxis &amp; degranulation; partial albinism.</li>\n  <li><strong>Hyper-IgE (Job) syndrome</strong> \u2014 impaired chemotaxis \u2192 cold staphylococcal abscesses, retained primary teeth, eczema, high IgE.</li>\n</ul>\n\n<img src=\"https://placehold.co/600x400?text=Neutrophil+Extravasation+Cascade\" alt=\"Neutrophil adhesion and migration cascade diagram\">\n\n<h3>Clinical Pearl</h3>\n<p>Glucocorticoids <em>reduce</em> ICAM-1 expression on endothelium \u2014 explaining both their anti-inflammatory benefit and their propensity to impair bacterial clearance. This is also why a patient on steroids may show a paucity of pus at an infection site even with florid sepsis \u2014 clinical signs are masked, and a high index of suspicion is required.</p>\n"
              },

                marks: 6,
                question: "List the mediators derived from cells and their role in producing inflammation.",
                answer: "\n<h3>Overview</h3>\n<p>Chemical mediators of inflammation are released from <strong>cells</strong> (mast cells, platelets, neutrophils, macrophages, endothelium) and from <strong>plasma</strong> (kinin, complement, coagulation/fibrinolytic systems). Here we focus on the <strong>cell-derived</strong> mediators \u2014 the viva expects you to list, classify, and indicate actions.</p>\n\n<h3>Cell-Derived Mediators \u2014 Master List</h3>\n<table class=\"w-full text-sm border-collapse my-3\">\n  <thead class=\"bg-slate-100 dark:bg-slate-700\">\n    <tr><th class=\"border p-2 text-left\">Mediator</th><th class=\"border p-2 text-left\">Source</th><th class=\"border p-2 text-left\">Major Actions</th></tr>\n  </thead>\n  <tbody>\n    <tr><td class=\"border p-2\"><strong>Histamine</strong></td><td class=\"border p-2\">Mast cells, basophils, platelets (preformed in granules)</td><td class=\"border p-2\">Vasodilation (H1 on vascular smooth muscle); \u2191 vascular permeability (endothelial contraction); bronchoconstriction; itching (H1 on sensory nerves); gastric acid secretion (H2)</td></tr>\n    <tr><td class=\"border p-2\"><strong>Serotonin (5-HT)</strong></td><td class=\"border p-2\">Platelets, mast cells (rodent)</td><td class=\"border p-2\">Vasodilation &amp; \u2191 permeability (less potent than histamine)</td></tr>\n    <tr><td class=\"border p-2\"><strong>Prostaglandins (PGs)</strong></td><td class=\"border p-2\">All nucleated cells (COX-1 constitutive, COX-2 inducible from arachidonic acid)</td><td class=\"border p-2\">PGE2 \u2014 vasodilation, fever, potentiate pain (with bradykinin), \u2191 permeability (with histamine). PGD2 \u2014 mast-cell vasodilation. PGI2 (prostacyclin) \u2014 vasodilation &amp; platelet inhibition. TXA2 \u2014 vasoconstriction &amp; platelet aggregation (from platelets).</td></tr>\n    <tr><td class=\"border p-2\"><strong>Leukotrienes (LTs)</strong></td><td class=\"border p-2\">Leucocytes (5-lipoxygenase pathway)</td><td class=\"border p-2\">LTB4 \u2014 potent chemotaxin &amp; neutrophil activator. LTC4, LTD4, LTE4 (slow-reacting substance of anaphylaxis) \u2014 bronchoconstriction 100\u20131000\u00d7 histamine; \u2191 vascular permeability</td></tr>\n    <tr><td class=\"border p-2\"><strong>Lipoxins (LXs)</strong></td><td class=\"border p-2\">Platelets (from neutrophil-derived LTA4)</td><td class=\"border p-2\"><strong>Anti-inflammatory</strong> \u2014 inhibit neutrophil recruitment; promote resolution. \"Brake\" of inflammation</td></tr>\n    <tr><td class=\"border p-2\"><strong>Platelet-Activating Factor (PAF)</strong></td><td class=\"border p-2\">Mast cells, neutrophils, monocytes, endothelium, platelets</td><td class=\"border p-2\">Platelet aggregation &amp; degranulation; vasodilation; \u2191 permeability (1000\u201310 000\u00d7 histamine); chemotaxis; bronchoconstriction</td></tr>\n    <tr><td class=\"border p-2\"><strong>Reactive Oxygen Species (ROS)</strong></td><td class=\"border p-2\">Neutrophils, macrophages (NADPH oxidase)</td><td class=\"border p-2\">Killing of microbes (O\u2082\u207b, H\u2082O\u2082, HOCl); tissue damage (lipid peroxidation, protease activation); inactivate antiproteases</td></tr>\n    <tr><td class=\"border p-2\"><strong>NO (Nitric Oxide)</strong></td><td class=\"border p-2\">Endothelium (eNOS), macrophages (iNOS), neurons (nNOS)</td><td class=\"border p-2\">Vasodilation (smooth-muscle relaxation via cGMP); antiplatelet; antimicrobial (reactive nitrogen species); cytotoxicity in chronic inflammation</td></tr>\n    <tr><td class=\"border p-2\"><strong>Cytokines</strong></td><td class=\"border p-2\">Macrophages, lymphocytes, endothelium, mast cells</td><td class=\"border p-2\">TNF-\u03b1, IL-1 \u2014 endothelial activation, fever, acute-phase response, cachexia. IL-6 \u2014 acute-phase synthesis in liver. IL-8 (CXCL8) \u2014 neutrophil chemotaxis. IL-12 \u2014 Th1 polarisation. IFN-\u03b3 \u2014 macrophage activation</td></tr>\n    <tr><td class=\"border p-2\"><strong>Chemokines</strong></td><td class=\"border p-2\">All nucleated cells</td><td class=\"border p-2\">Chemotaxis of leucocytes to site of injury; classified CC, CXC, C, CX3C</td></tr>\n    <tr><td class=\"border p-2\"><strong>Lysosomal enzymes</strong></td><td class=\"border p-2\">Neutrophils (azurophilic &amp; specific granules), macrophages</td><td class=\"border p-2\">Proteases (elastase, collagenase, cathepsin) \u2192 tissue destruction; lysozyme \u2192 bacterial wall lysis; lactoferrin \u2192 iron chelation; myeloperoxidase \u2192 microbial killing (with H\u2082O\u2082 + Cl\u207b)</td></tr>\n    <tr><td class=\"border p-2\"><strong>Defensins</strong></td><td class=\"border p-2\">Neutrophils, intestinal Paneth cells, epithelia</td><td class=\"border p-2\">Arginine-rich cationic peptides \u2192 punch holes in bacterial membranes</td></tr>\n    <tr><td class=\"border p-2\"><strong>Neuropeptides</strong></td><td class=\"border p-2\">Sensory nerve endings (C fibres)</td><td class=\"border p-2\">Substance P \u2014 vasodilation, \u2191 permeability, pain transmission; CGRP \u2014 vasodilation</td></tr>\n  </tbody>\n</table>\n\n<div class=\"mermaid\">\nflowchart TD\n    A[Cell membrane phospholipid] -->|Phospholipase A2| B[Arachidonic Acid]\n    B -->|Cyclooxygenase COX-1 / COX-2| C[Prostaglandins<br/>PGE2 / PGI2 / TXA2 / PGD2]\n    B -->|5-Lipoxygenase| D[Leukotrienes<br/>LTB4 / LTC4 / LTD4 / LTE4]\n    B -->|Lipooxygenase interaction| E[Lipoxins<br/>anti-inflammatory]\n    C --> F[Vasodilation, fever, pain, platelet modulation]\n    D --> G[Chemotaxis, bronchoconstriction, permeability]\n    E --> H[Resolution of inflammation]\n</div>\n\n<h3>Functional Summary (for viva recall)</h3>\n<ul>\n  <li><strong>Vasodilation</strong> \u2014 histamine, PGE2, PGI2, NO, PAF.</li>\n  <li><strong>\u2191 Vascular Permeability</strong> \u2014 histamine, bradykinin (plasma), PAF, LTC4/D4/E4, substance P.</li>\n  <li><strong>Pain</strong> \u2014 bradykinin, PGE2 (sensitises nociceptors), substance P.</li>\n  <li><strong>Fever</strong> \u2014 PGE2 (acts on hypothalamus), IL-1, TNF-\u03b1, IL-6 (acute-phase pyrogens).</li>\n  <li><strong>Chemotaxis</strong> \u2014 LTB4, C5a, IL-8, bacterial f-Met peptides, PAF.</li>\n  <li><strong>Tissue damage</strong> \u2014 ROS, lysosomal proteases (elastase, collagenase), NO.</li>\n</ul>\n\n<img src=\"https://placehold.co/600x400?text=Arachidonic+Acid+Metabolism+COX+LOX+Pathways\" alt=\"Arachidonic acid metabolism diagram\">\n\n<h3>Clinical Pearl \u2014 Drug Targets</h3>\n<ul>\n  <li><strong>NSAIDs</strong> block COX-1 &amp; COX-2 \u2192 \u2193 PGs &amp; thromboxanes. COX-2 selective (celecoxib) spares gastric protection (PGE2) but \u2191 thrombotic risk (loss of PGI2 leaving TXA2 unopposed).</li>\n  <li><strong>Corticosteroids</strong> induce lipocortin-1 \u2192 \u2193 phospholipase A2 \u2192 \u2193 <em>both</em> PGs &amp; LTs. Comprehensive anti-inflammatory action.</li>\n  <li><strong>Leukotriene-receptor antagonists (montelukast, zafirlukast)</strong> block LTD4 receptor \u2014 useful in asthma, especially aspirin-exacerbated respiratory disease.</li>\n  <li><strong>Anti-IgE (omalizumab)</strong> &amp; <strong>anti-IL-5 (mepolizumab)</strong> target upstream signalling in severe asthma.</li>\n  <li><strong>Anti-TNF biologics</strong> (infliximab, adalimumab, etanercept) \u2014 TNF-\u03b1 blockade in rheumatoid arthritis, IBD, psoriasis, ankylosing spondylitis.</li>\n</ul>\n"
