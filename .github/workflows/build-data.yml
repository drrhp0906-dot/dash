name: build-data
on: { push: { paths: ['answers.json', 'scripts/build-data.mjs'] } }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-data.mjs
      - run: |
          git config user.name "data-bot" && git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "chore: rebuild data/ from answers.json" && git push)